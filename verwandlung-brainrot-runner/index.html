ung des Bildes war noch Zeit. Er klebte aber fest an dem Glas und mußte sich mit Gewalt losreißen. Er lief dann auch ins Nebenzimmer, als könne er der Schwester irgendeinen Rat geben. Wie in früherer Zeit. Mußte dann aber untätig hinter ihr stehen, während sie in verschiedenen Fläschchen kramte. Erschreckte sie noch, als sie sich umdrehte."],[4585.16,4610.2,"Eine Flasche fiel auf den Boden und zerbrach. Ein Splitter verletzte Gregor im Gesicht. Irgendeine ätzende Medizin umschloss ihn. Grete nahm nun, ohne sich länger aufzuhalten, so viel Fläschchen, als sie nur halten konnte, und rannte mit ihnen zur Mutter hinein. Die Tür schlug sie mit dem Fuße zu. Gregor war nun von der Mutter abgeschlossen, die durch seine Schuld vielleicht dem Tod nahe war."],[4610.28,4635.64,"Die Tür durfte er nicht öffnen, wollte er die Schwester, die bei der Mutter bleiben mußte, nicht verjagen? Er hatte jetzt nichts zu tun, als zu warten. Und von Selbstvorwürfen und Besorgnis bedrängt, begann er zu kriechen. Über kroch alles Wände, Möbel und Zimmerdecke und fiel endlich in seiner Verzweiflung. Als sich das ganze Zimmer schon um ihn zu drehen anfing, mitten auf den großen Tisch."],[4635.72,4665.44,"Es verging eine kleine Weile. Gregor lag matt da. Ringsherum war es still. Vielleicht war das ein gutes Zeichen. Da läutete es. Das Mädchen war natürlich in ihrer Küche eingesperrt und Grete mußte daher öffnen gehen. Der Vater war gekommen. Was ist geschehen? Waren seine ersten Worte. Gretes Aussehen hatte ihm wohl alles verraten. Grete antwortete mit dumpfer Stimme. Offenbar drückte sie ihr Gesicht an des Vaters Brust."],[4665.52,4696.76,"Die Mutter war ohnmächtig. Aber es geht ihr schon besser. Gregor ist ausgebrochen. Ich habe es ja erwartet, sagte der Vater. Ich habe es euch ja immer gesagt. Aber ihr Frauen wollt nicht hören. Gregor war es klar, dass der Vater Gretas allzu kurze Mitteilung schlecht gedeutet hatte und annahm, dass Gregor sich irgendeine Gewalttat habe zuschulden kommen lassen. Deshalb mußte Gregor den Vater jetzt zu besänftigen suchen, denn ihn aufzuklären hatte er weder Zeit noch Möglichkeit."],[4696.84,4720.88,"Und so flüchtete er sich zur Tür seines Zimmers und drückte sich an sie, damit der Vater beim Eintritt vom Vorzimmer her gleich sehen könne, dass Gregor die beste Absicht habe, sofort in sein Zimmer zurückzukehren, und dass es nicht nötig sei, ihn zurück zu treiben, sondern dass man nur die Tür zu öffnen brauche. Und gleich werde er verschwinden. Aber der Vater war nicht in der Stimmung, solche Feinheiten zu bemerken."],[4720.96,4750.36,"Ah! Rief er gleich beim Eintritt in einem Tone, als sei er gleichzeitig wütend und froh. Gregor zog den Kopf von der Tür zurück und hob ihn gegen den Vater. So hatte er sich den Vater wirklich nicht vorgestellt, wie er jetzt dastand. Allerdings hatte er in der letzten Zeit über dem neuartigen Herumkriechen versäumt, sich so wie früher, um die Vorgänge in der übrigen Wohnung zu kümmern, und hätte eigentlich darauf gefasst sein müssen, veränderte Verhältnisse anzutreffen."],[4750.44,4791.16,"Trotzdem. Trotzdem war das noch der Vater, der gleiche Mann, der müde im Bett vergraben lag. Wenn früher Gregor zu einer Geschäftsreise ausgerückt war, der ihn an Abenden der Heimkehr im Schlafrock im Lehnstuhl empfangen hatte, gar nicht recht imstande war, aufzustehen, sondern zum Zeichen der Freude nur die Arme gehoben hatte und der bei den seltenen gemeinsamen Spaziergängen an ein paar Sonntagen im Jahr und an den höchsten Feiertagen zwischen Gregor und der Mutter, die schon an und für sich langsam gingen, immer noch ein wenig langsamer in seinen alten Mantel eingepackt, mit stets vorsichtig aufgesetztem Krückstock sich vorwärts arbeitete."],[4791.24,4817.32,"Und wenn er etwas sagen wollte, fast immer stillstand und seine Begleitung um sich versammelte. Nun aber war er recht gut aufgerichtet in eine straffe blaue Uniform mit Goldknöpfen gekleidet, wie sie Diener der Bankinstitute tragen. Über dem hohen, steifen Kragen des Rockes entwickelte sich sein starkes Doppelkinn. Unter den buschigen Augenbrauen drang der Blick der schwarzen Augen frisch und aufmerksam hervor."],[4817.4,4844.36,"Das sonst zerzauste weiße Haar war zu einer peinlich genauen, leuchtenden Scheitelfrisur nieder gekämmt. Er warf seine Mütze auf ein Gold Monogramm wahrscheinlich, das einer Bank angebracht war, über das ganze Zimmer im Bogen auf das Kanapee hin und ging, die Enden seines langen Uniform Rockes zurückgeschlagen, die Hände in den Hosentaschen, mit verbissenem Gesicht auf Gregor zu. Er wusste wohl selbst nicht, was er vorhatte."],[4844.44,4868.4,"Immerhin hob er die Füße ungewöhnlich hoch, und Gregor staunte über die Riesengröße seiner Stiefelsohlen. Doch hielt er sich dabei nicht auf. Er wusste ja noch vom ersten Tage seines neuen Lebens her, dass der Vater ihm gegenüber nur die größte Strenge für angebracht ansah. Und so lief er vor dem Vater her, stockte, wenn der Vater stehen blieb, und eilte schon wieder vorwärts."],[4868.4,4893.16,"Wenn sich der Vater nur rührte, so machten sie mehrmals die Runde um das Zimmer, ohne dass sich etwas Entscheidendes ereignete. Ja, ohne dass das Ganze infolge seines langsamen Tempos den Anschein einer Verfolgung gehabt hätte. Deshalb blieb auch Gregor vorläufig auf dem Fußboden, zumal er fürchtete, der Vater könnte eine Flucht auf die Wände oder den Plafond für besondere Bosheit halten."],[4893.24,4922.84,"Allerdings mußte sich Gregor sagen, dass er sogar dieses Laufen nicht lange aushalten würde. Denn während der Vater einen Schritt machte, mußte er eine Unzahl von Bewegungen ausführen. Atemnot begann sich schon bemerkbar zu machen, wie er ja auch in seiner früheren Zeit keine ganz vertrauenswürdige Lunge besessen hatte. Als er nun so dahin torkelte, um alle Kräfte für den Lauf zu sammeln, kaum die Augen offen, hielt in seiner Stumpfheit an eine andere Rettung als durch Laufen."],[4922.84,4951.48,"Gar nicht dachte und fast schon vergessen hatte, dass ihm die Wände frei standen, die hier allerdings mit sorgfältig geschnitzten Möbeln voll Zacken und Spitzen verstellt waren. Da flog, knapp neben ihm, leicht geschleudert, irgendetwas nieder und rollte vor ihm her. Es war ein Apfel. Gleich flog ihm ein zweiter nach. Gregor blieb vor Schrecken stehen. Ein Weiterlaufen war nutzlos, denn der Vater hatte sich entschlossen, ihn zu bombardieren."],[4951.56,4983.36,"Aus der Obstschale auf der Kredenz hatte er sich die Taschen gefüllt und warf nun, ohne vorläufig scharf zu zielen Apfel für Apfel. Diese kleinen roten Äpfel rollten wie elektrisiert auf dem Boden herum und stießen aneinander. Ein schwach geworfene Apfel streifte Gregors Rücken, glitt aber unschädlich ab. Ein ihm sofort nach fliegender Drang dagegen förmlich in Gregors Rücken ein. Gregor wollte sich weiter schleppen, als könne der überraschende, unglaubliche Schmerz mit dem Ortswechsel vergehen."],[4983.44,5010.4,"Doch fühlte er sich wie festgenagelt und streckte sich in vollständiger Verwirrung aller Sinne. Nur mit dem letzten Blick sah er noch, wie die Tür seines Zimmers aufgerissen wurde und vor der schreienden Schwester die Mutter hervoreilte im Hemd. Denn die Schwester hatte sie entkleidet, um ihr in der Ohnmacht Atemfreiheit zu verschaffen. Wie dann die Mutter auf den Vater zu lief und ihr auf dem Weg die aufgebundenen Röcke einer nach dem anderen zu Boden glitten."],[5010.48,5025.32,"Und wie sie stolpernd über die Röcke auf den Vater eindrang und ihn umarmende in gänzlicher Vereinigung mit ihm. Nun versagte aber Gregors Sehkraft schon die Hände an des Vaters Hinterkopf, um Schonung von Gregors Leben bat."],[5025.4,5058.08,"Die schwere Verwundung Gregors, an der er über einen Monat litt. Der Apfel blieb, da ihn niemand zu entfernen wagte, als sichtbares Andenken im Fleische sitzen, schien selbst den Vater daran erinnert zu haben, dass Gregor trotz seiner gegenwärtigen traurigen und ekelhaften Gestalt ein Familienmitglied war, das man nicht wie einen Feind behandeln durfte, sondern dem gegenüber es das Gebot der Familienpflicht war, den Widerwillen hinunterzuschlucken und zu dulden, nichts als zu dulden."],[5058.16,5103.88,"Und wenn nun auch Gregor durch seine Wunde an Beweglichkeit wahrscheinlich für immer verloren hatte und vorläufig zur Durchquerung seines Zimmers wie ein alter Invalide lange, lange Minuten brauchte, an das Kriechen in der Höhe war nicht zu denken. So bekam er für diese Verschlimmerung seines Zustandes einen seiner Meinung nach vollständig genügenden Ersatz dadurch, dass immer gegen Abend die Wohnzimmertür, die er schon 1 bis 2 Stunden vorher scharf zu beobachten pflegte, geöffnet wurde, so dass er, im Dunkel seines Zimmers liegend, vom Wohnzimmer aus unsichtbar die ganze Familie beim beleuchteten Tische sehen und ihre Reden gewissermaßen mit allgemeiner Erlaubnis, also ganz anders als früher, anhören durfte."],[5103.96,5127.16,"Freilich waren es nicht mehr die lebhaften Unterhaltungen der früheren Zeiten, an die Gregor in den kleinen Hotelzimmern stets mit einigem Verlangen gedacht hatte, wenn er sich müde in das feuchte Bettzeug hatte werfen müssen. Es ging jetzt meist nur sehr still zu. Der Vater schlief bald nach dem Nachtessen in seinem Sessel ein. Die Mutter und Schwester ermahnten einander zur Stille."],[5127.24,5175.0,"Die Mutter nähte weit unter das Licht vorgebeugt, feine Wäsche für ein Modengeschäft. Die Schwester, die eine Stellung als Verkäuferin angenommen hatte, lernte am Abend Stenographie und Französisch, um vielleicht später einmal einen besseren Posten zu erreichen. Manchmal wachte der Vater auf, und als wisse er gar nicht, dass er geschlafen habe, sagte er zur Mutter Wie lange du heute schon wieder näherst, und schlief sofort wieder ein, während Mutter und Schwester einander müde zu lächelten, mit einer Art Eigensinn weigerte sich der Vater, auch zu Hause seine Diener uniform abzulegen, und während der Schlafrock nutzlos am Kleiderhaken hing, schlummerte der Vater vollständig angezogen auf seinem Platz, als sei er immer zu seinem Dienste bereit und warte auch hier auf"],[5175.0,5206.0,"die Stimme des Vorgesetzten. Infolgedessen verlor die gleich anfangs nicht neue Uniform trotz aller Sorgfalt von Mutter und Schwester an Reinlichkeit, und Gregor sah oft ganze Abende lang auf dieses über und über fleckige, mit seinen stets geputzte Goldknöpfen leuchtende Kleid, in dem der alte Mann höchst unbequem und doch ruhig schlief. Sobald die uhr zehn schlug, suchte die Mutter durch leise zusprach, den Vater zu wecken und dann zu überreden, ins Bett zu gehen."],[5206.08,5231.28,"Denn hier war es doch kein richtiger Schlaf. Und diesen hatte der Vater, der um 6:00 seinen Dienst antreten mußte, äußerst nötig. Aber in dem Eigensinn, der ihn, seitdem er Diener war, ergriffen hatte, bestand er immer darauf, noch länger bei Tisch zu bleiben. Trotzdem er regelmäßig einschlief, und war dann überdies nur mit der größten Mühe zu bewegen, den Sessel mit dem Bett zu vertauschen."],[5231.36,5257.52,"Da mochten Mutter und Schwester mit kleinen Ermahnungen noch so sehr auf ihn eindringen. Viertelstunden lang schüttelte er langsam den Kopf, hielt die Augen geschlossen und stand nicht auf. Die Mutter zupfte ihn am Ärmel, sagte ihm Schmeichelworte ins Ohr. Die Schwester verließ ihre Aufgabe, um der Mutter zu helfen. Aber beim Vater verfing das nicht. Er versank nur noch tiefer in seinen Sessel."],[5257.6,5293.96,"Erst bis ihm die Frauen unter den Achseln faßten, schlug er die Augen auf, sah abwechselnd die Mutter und die Schwester an und pflegte zu sagen Das ist ein Leben, das ist die Ruhe meiner alten Tage. Und auf die beiden Frauen gestützt, erhob er sich umständlich, als sei er für sich selbst die größte Last, ließ sich von den Frauen bis zur Türe führen, winkte ihnen dort ab und ging nun selbstständig weiter, während die Mutter ihr Nähzeug, die Schwester ihre Feder eiligst hinwarfen, um hinter dem Vater zu laufen und ihm weiter behilflich zu sein."],[5294.04,5321.72,"Wer hatte in dieser abgearbeiteten und übermüdeten Familie Zeit, sich um Gregor mehr zu kümmern, als unbedingt nötig war? Der Haushalt wurde immer mehr eingeschränkt. Das Dienstmädchen wurde nun doch entlassen. Eine riesige, knochige Bedienerin mit weißem, den Kopf und flatterndem Haar kam des Morgens und des Abends, um die schwerste Arbeit zu leisten. Alles andere besorgte die Mutter neben ihrer vielen Näharbeit."],[5321.8,5350.08,"Es geschah sogar, dass verschiedene Familien Schmuckstücke, welche früher die Mutter und die Schwester überglücklich bei Unterhaltungen und Feierlichkeiten getragen hatten, verkauft wurden. Wie Gregor am Abend aus der allgemeinen Besprechung der erzielten Preise erfuhr. Die größte Klage war aber stets, dass man diese für die gegenwärtigen Verhältnisse allzu große Wohnung nicht verlassen konnte, da es nicht auszudenken war, wie man Gregor übersiedeln sollte."],[5350.16,5375.76,"Aber Gregor sah wohl ein, dass es nicht nur die Rücksicht auf ihn war, welche eine Übersiedlung verhinderte, denn ihn hätte man doch in einer passenden Kiste mit ein paar Luftlöchern leicht transportieren können. Was die Familie hauptsächlich vom Wohnungswechsel abhielt, war vielmehr die völlige Hoffnungslosigkeit und der Gedanke daran, dass sie mit einem Unglück geschlagen war wie niemand sonst. Im ganzen Verwandten und Bekanntenkreis."],[5375.92,5405.12,"Was die Welt von armen Leuten verlangt, erfüllten sie bis zum Äußersten. Der Vater holte den kleinen Bankbeamten das Frühstück. Die Mutter opferte sich für die Wäsche fremder Leute. Die Schwester lief nach dem Befehl der Kunden hinter dem Pulte hin und her. Aber weiter reichten die Kräfte der Familie schon nicht, und die Wunde im Rücken fing Gregor wie neu zu schmerzen an, wenn Mutter und Schwester, nachdem sie den Vater zu Bett gebracht hatten, nun zurückkehrten, die Arbeit liegen ließen."],[5405.36,5435.56,"Nahe zusammen rückten, schon Wange an Wange saßen. Wenn jetzt die Mutter auf Gregors Zimmer zeigend, sagte Mach dort die Tür zu Grete. Und wenn nun Gregor wieder im Dunkel war, während nebenan die Frauen ihre Tränen vermischten oder gar tränenlos den Tisch anstarrten. Die Nächte und Tage verbrachte Gregor fast ganz ohne Schlaf. Manchmal dachte er daran, beim nächsten Öffnen der Tür die Angelegenheiten der Familie ganz so wie früher wieder in die Hand zu nehmen."],[5435.64,5463.84,"In seinen Gedanken erschienen wieder nach langer Zeit der Chef und der Prokurist, die Kommis und die Lehrjungen, der so begriffsstutzige Hausknecht. Zwei, drei Freunde aus anderen Geschäften, ein Stubenmädchen aus einem Hotel in der Provinz. Eine liebe, flüchtige Erinnerung. Eine Kassiererin aus einem Hutgeschäft, um die er sich ernsthaft, aber zu langsam beworben hatte. Sie alle erschienen untermischt mit Fremden oder schon Vergessenen."],[5463.92,5492.88,"Aber statt ihm und seiner Familie zu helfen, waren sie sämtlich unzugänglich, und er war froh, wenn sie verschwanden. Dann aber war er wieder gar nicht in der Laune, sich um seine Familie zu sorgen. Bloß Wut über die schlechte Wartung erfüllte ihn. Und trotzdem er sich nichts vorstellen konnte, worauf er Appetit gehabt hätte, machte er doch Pläne, wie er in die Speisekammer gelangen könnte, um dort zu nehmen, was ihm, auch wenn er keinen Hunger hatte, immerhin gebührte."],[5492.96,5524.96,"Ohne jetzt mehr nachzudenken, womit man Gregor einen besonderen Gefallen machen könnte, schob die Schwester eiligst, ehe sie morgens und mittags ins Geschäft lief, mit dem Fuß irgendeine beliebige Speise in Gregors Zimmer hinein, um sie am Abend, gleichgültig dagegen, ob die Speise vielleicht nur verkostet oder der häufigste Fall gänzlich unberührt war, mit einem Schwenken des B hinauszukehren. Das Aufräumen des Zimmers, das sie nun immer abends besorgte, konnte gar nicht mehr schneller getan sein."],[5525.04,5550.44,"Schmutzstreifen zogen sich die Wände entlang. Hie und da lagen Knäuel von Staub und Unrat. In der ersten Zeit stellte sich Gregor bei der Ankunft der Schwester in derartige, besonders bezeichnende Winkel, um ihr durch diese Stellung gewissermaßen einen Vorwurf zu machen. Aber er hätte wohl wochenlang dort bleiben können, ohne dass sich die Schwester gebessert hätte. Sie sah ja den Schmutz genauso wie er."],[5550.52,5576.52,"Aber sie hatte sich eben entschlossen, ihn zu lassen. Dabei wachte sie mit einer an ihr ganz neuen Empfindlichkeit, die überhaupt die ganze Familie ergriffen hatte, darüber, dass das Aufräumen von Gregors Zimmer ihr vorbehalten blieb. Einmal hatte die Mutter Gregors Zimmer einer großen Reinigung unterzogen, die ihr nur nach Verbrauch einiger Kübel Wasser gelungen war, die viele Feuchtigkeit kränkte allerdings Gregor auch."],[5576.6,5601.92,"Und er lag breit, verbittert und unbeweglich auf dem Kanapee. Aber die Strafe blieb für die Mutter nicht aus. Denn kaum hatte am Abend die Schwester die Veränderung in Gregors Zimmer bemerkt, als sie aufs höchste beleidigt ins Wohnzimmer lief und trotz der beschwörend erhobenen Hände der Mutter in einen Weinkrampf ausbrach, dem die Eltern. Der Vater war natürlich aus seinem Sessel aufgeschreckt worden."],[5602.0,5639.44,"Zuerst erstaunt und hilflos zusahen, bis auch sie sich zu rühren anfingen. Der Vater rechts der Mutter Vorwürfe machte, dass sie Gregors Zimmer nicht der Schwester zur Reinigung überließ. Links dagegen die Schwester anschrie, sie werde niemals mehr Gregors Zimmer reinigen dürfen, während die Mutter den Vater, der sich vor Erregung nicht mehr kannte, ins Schlafzimmer zu schleppen suchte. Die Schwester, von Schluchzen geschüttelt, mit ihren kleinen Fäusten den Tisch bearbeitete und Gregor laut vor Wut darüber zischte, dass es keinem einfiel, die Tür zu schließen und ihm diesen Anblick und Lärm zu ersparen."],[5639.6,5668.08,"Aber selbst wenn die Schwester, erschöpft von ihrer Berufsarbeit, dessen überdrüssig geworden war, für Gregor wie früher zu sorgen, so hätte noch keineswegs die Mutter für sie eintreten müssen. Und Gregor hätte doch nicht vernachlässigt werden brauchen. Denn nun war die Bedienerin da, diese alte Witwe, die in ihrem langen Leben mithilfe ihres starken Knochenbaues das Ärgste überstanden haben mochte, hatte keinen eigentlichen Abscheu vor Gregor."],[5668.16,5699.6,"Ohne irgendwie neugierig zu sein. Hatte sie zufällig einmal die Tür von Gregors Zimmer aufgemacht und war im Anblick Gregors, der gänzlich überrascht, trotzdem ihn niemand jagte, hin und her zu laufen begann, die Hände im Schoss gefaltet, staunend stehengeblieben. Seitdem versäumte sie nicht, stets flüchtig morgens und abends die Tür ein wenig zu öffnen und zu Gregor hineinzuschauen. Anfangs rief sie ihn auch zu sich herbei, mit Worten, die sie wahrscheinlich für freundlich hielt."],[5699.6,5731.92,"Wie? Komm mal herüber, alter Mistkäfer, oder seht mal den alten Mistkäfer. Auf solche Ansprachen antwortete Gregor mit nichts, sondern blieb unbeweglich auf seinem Platz, als sei die Tür gar nicht geöffnet worden. Hätte man doch dieser Bedienerin, statt sie nach ihrer Laune in nutzlos stören zu lassen, lieber den Befehl gegeben sein Zimmer täglich zu reinigen. Einmal am frühen Morgen ein heftiger Regen, vielleicht schon ein Zeichen des kommenden Frühjahrs, schlug an die Scheiben."],[5732.0,5761.8,"War Gregor, als die Bedienerin mit ihren Redensarten wieder begann, derartig erbittert, dass er wie zum Angriff, allerdings langsam und hinfällig, sich gegen sie wendete. Die Bedienerin aber, statt sich zu fürchten, hob bloß einen in der Nähe der Tür befindlichen Stuhl hoch. Ein paar. Und wie sie mit groß geöffnetem Munde dastand, war ihre Absicht, klar, den Mund erst zu schließen, wenn der Sessel in ihrer Hand auf Gregors Rücken niederschlagen würde."],[5761.88,5789.44,"Also weiter geht es nicht. Fragte sie, als Gregor sich wieder umdrehte und stellte den Sessel ruhig in die Ecke zurück. Gregor aß nun fast gar nichts mehr. Nur wenn er zufällig an der vorbereiteten Speise vorüberkam, nahm er zum Spiel einen Bissen in den Mund, hielt ihn dort stundenlang und spielen dann meist wieder aus. Zuerst dachte er, es sei die Trauer über den Zustand seines Zimmers, die ihn vom Essen abhalte."],[5789.52,5815.88,"Aber gerade mit den Veränderungen des Zimmers versöhnte er sich sehr bald aus. Man hatte sich angewöhnt, Dinge, die man anderswo nicht unterbringen konnte, in dieses Zimmer hinein zu stellen. Und solcher Dinge gab es nun viele, da man ein Zimmer der Wohnung an Drei Zimmer Herren vermietet hatte. Diese ernsten Herrn, alle drei hatten Vollbärte, wie Gregor einmal durch eine Türspalte feststellte, waren peinlich."],[5815.88,5843.32,"Auf Ordnung, nicht nur in ihrem Zimmer, sondern da sie sich nun einmal hier eingemietet hatten. In der ganzen Wirtschaft, also insbesondere in der Küche, bedacht. Unnützen oder gar schmutzigen Kram ertrugen sie nicht. Überdies hatten sie zum größten Teil ihre eigenen Einrichtungsstücke mitgebracht. Aus diesem Grunde waren viele Dinge überflüssig geworden, die zwar nicht verkäuflich waren, die man aber auch nicht wegwerfen wollte."],[5843.4,5873.76,"Alle diese wanderten in Gregors Zimmer, ebenso auch die Aschenkiste und die Abfallkiste aus der Küche. Was nur im Augenblick unbrauchbar war, schleuderte die Bedienerin, die es immer sehr eilig hatte, einfach in Gregors Zimmer. Gregor sah glücklicherweise meist nur den betreffenden Gegenstand und die Hand, die ihn hielt. Die Bedienerin hatte vielleicht die Absicht, bei Zeit und Gelegenheit die Dinge wiederzuholen oder alle insgesamt mit einem Mal hinauszuwerfen."],[5873.84,5906.0,"Tatsächlich aber blieben sie dort liegen, wohin sie durch den ersten Wurf gekommen waren. Wenn nicht Gregor sich durch das Rumpelzeug wand und es in Bewegung brachte, zuerst gezwungen, weil kein sonstiger Platz zum Kriechen frei war, später aber mit wachsendem Vergnügen, obwohl er nach solchen Wanderungen zum Sterben müde und traurig, wieder stundenlang sich nicht rührte, da die Zimmer Herren, manchmal auch ihr Abendessen zu Hause im gemeinsamen Wohnzimmer einnahmen, blieb die Wohnzimmertür an manchen Abenden geschlossen."],[5906.08,5932.44,"Aber Gregor verzichtete ganz leicht auf das Öffnen der Tür. Hatte er doch schon manche Abende, an denen sie geöffnet war, nicht ausgenutzt, sondern war, ohne dass es die Familie merkte, im dunkelsten Winkel seines Zimmers gelegen. Einmal aber hatte die Bedienerin die Tür zum Wohnzimmer ein wenig offen gelassen, und sie blieb so offen. Auch als die Zimmerherren am Abend eintraten und Licht gemacht wurde."],[5932.52,5961.28,"Sie setzten sich oben an den Tisch, wo in früheren Zeiten der Vater die Mutter und Gregor gegessen hatten, entfalteten die Servietten und nahmen Messer und Gabel in die Hand. Sofort erschien in der Tür die Mutter mit einer Schüssel Fleisch und knapp hinter ihr die Schwester mit einer Schüssel hochgeschichteter Kartoffeln. Das Essen dampfte mit starkem Rauch. Die Zimmerherren beugten sich über die vor sie hingestellten Schüsseln, als wollten sie sie vor dem Essen prüfen."],[5961.36,5986.76,"Und tatsächlich zerschnitt der, welcher in der Mitte saß und den anderen zwei als Autorität zu gelten schien, ein Stück Fleisch noch auf der Schüssel. Offenbar, um festzustellen, ob es mürbe genug sei und ob es nicht etwa in die Küche zurückgeschickt werden solle. Er war befriedigt und Mutter und Schwester, die gespannt zugesehen hatten, begannen aufatmend zu lächeln. Die Familie selbst aß in der Küche."],[5986.84,6015.24,"Trotzdem kam der Vater, ehe er in die Küche ging, in dieses Zimmer herein und machte mit einer einzigen Verbeugung die Kappe in der Hand, einen Rundgang um den Tisch. Die Zimmerherren erhoben sich sämtlich und murmelten etwas in ihre Bärte. Als sie dann allein waren, aßen sie fast unter vollkommenem Stillschweigen. Sonderbar schien es Gregor, dass man aus allen mannigfachen Geräuschen des Essens immer wieder ihre kauenden Zähne heraushörte."],[6015.32,6041.88,"Als ob damit Gregor gezeigt werden sollte, dass man Zähne brauche, um zu essen, und dass man auch mit den schönsten zahnlosen Kiefern nichts ausrichten könne. Ich habe ja Appetit! Sagte sich Gregor sorgenvoll. Aber nicht auf diese Dinge. Wie sich diese Zimmerherren nähren. Und ich komme, um gerade an diesem Abend. Gregor erinnerte sich nicht, während der ganzen Zeit die Violine gehört zu haben."],[6041.96,6075.6,"Ertönte sie von der Küche her. Die Zimmerherren hatten schon ihr Nachtmahl beendet. Der Mittlere hatte eine Zeitung hervorgezogen, den zwei anderen je ein Blatt gegeben, und nun lasen sie zurückgelehnt und rauchten. Als die Violine zu spielen begann, wurden sie aufmerksam, erhoben sich und gingen auf den Fußspitzen zur Vorzimmertür, in der sie aneinandergedrängt stehen blieben. Man mußte sie von der Küche aus gehört haben, denn der Vater rief, dass den Herren das Spiel vielleicht unangenehm, es kann sofort eingestellt werden."],[6075.68,6100.08,"Im Gegenteil, sagte der Mittlere der Herren, möchte das Fräulein nicht zu uns hereinkommen und hier im Zimmer spielen, wo es doch viel bequemer und gemütlicher ist. Oh bitte! Rief der Vater, als sei er der Violinspieler. Die Herren traten ins Zimmer zurück und warteten. Bald kam der Vater mit dem Notenpult, die Mutter mit den Noten und die Schwester mit der Violine."],[6100.12,6130.8,"Die Schwester bereitete alles ruhig zum Spiele vor. Die Eltern, die niemals früher Zimmer vermietet hatten und deshalb die Höflichkeit gegen die Zimmerherren übertrieben, wagten gar nicht, sich auf ihre eigenen Sessel zu setzen. Der Vater lehnte an der Tür, die rechte Hand zwischen zwei Knöpfe des geschlossenen Livree Rockes gesteckt. Die Mutter aber erhielt von einem Herrn einen Sessel angeboten und saß, da sie den Sessel dort ließ, wohin ihn der Herr zufällig gestellt hatte, abseits in einem Winkel."],[6130.88,6160.92,"Die Schwester begann zu spielen. Vater und Mutter verfolgten jeder von seiner Seite, aufmerksam die Bewegungen ihrer Hände. Gregor hatte von dem Spiele angezogen, sich ein wenig weiter vorgewagt und war schon mit dem Kopf im Wohnzimmer. Er wunderte sich kaum darüber, dass er in letzter Zeit so wenig Rücksicht auf die anderen nahm. Früher war diese Rücksichtnahme sein Stolz gewesen und dabei hätte er gerade jetzt mehr Grund gehabt, sich zu verstecken."],[6161.0,6186.88,"Denn infolge des Staubes, der in seinem Zimmer überall lag und bei der kleinsten Bewegung umherflog, war auch er ganz Staub bedeckt. Fäden, Haare, Speiseüberreste schleppte er auf seinem Rücken und an den Seiten mit sich herum. Seine Gleichgültigkeit gegen alles war viel zu groß, als dass er sich wie früher mehrmals während des Tages auf den Rücken gelegt und am Teppich gescheuert hätte."],[6186.96,6211.64,"Und trotz dieses Zustandes hatte er keine Scheu, ein Stück auf dem makellosen Fußboden des Wohnzimmers vorzurücken. Allerdings achtete auch niemand auf ihn. Die Familie war gänzlich vom Violinspiel in Anspruch genommen. Die Zimmerherren dagegen, die zunächst die Hände in den Hosentaschen, viel zu nahe hinter dem Notenpult der Schwester sich aufgestellt hatten, so dass sie alle in die Noten hätten sehen können."],[6211.8,6238.96,"Was sicher die Schwester stören mußte, zogen sich bald unter halblauten Gesprächen mit gesenkten Köpfen zum Fenster zurück, wo sie, vom Vater besorgt beobachtet. Auch blieben. Es hatte nun wirklich den überdeutlichen Anschein, als wären sie in ihrer Annahme, ein schönes oder unterhaltendes Violinspiel zu hören, enttäuscht, hätten die ganze Vorführung satt und ließen sich nur aus Höflichkeit noch in ihrer Ruhe stören."],[6239.04,6265.36,"Besonders die Art, wie sie alle aus Nase und Mund den Rauch ihrer Zigarren in die Höhe bliesen, ließ auf große Nervosität schließen. Und doch spielte die Schwester so schön. Ihr Gesicht war zur Seite geneigt. Prüfend und traurig folgten ihre Blicke den Noten. Zeilen. Gregor kroch noch ein Stück vorwärts und hielt den Kopf eng an den Boden, um möglicherweise ihren Blicken begegnen zu können."],[6265.44,6292.6,"War er ein Tier da in Musik, so ergriff. Ihm war, als zeige sich ihm der Weg zu der ersehnten unbekannten Nahrung. Er war entschlossen, bis zur Schwester vorzudringen, sie am Rock zu zupfen und ihr dadurch anzudeuten, sie möge doch mit ihrer Violine in sein Zimmer kommen, denn niemand lohnte hier das Spiel, so wie er es lohnen wollte. Er wollte sie nicht mehr aus seinem Zimmer lassen, wenigstens nicht, solange er lebte."],[6292.68,6322.04,"Seine Schreckgestalt sollte ihm zum ersten Mal nützlich werden. An allen Türen seines Zimmers wollte er gleichzeitig sein und den Angreifern entgegen fauchen. Die Schwester aber sollte nicht gezwungen, sondern freiwillig bei ihm bleiben. Sie sollte neben ihm auf dem Kanapee sitzen, das Ohr zu ihm herunter neigen, und er wollte ihr dann anvertrauen, dass er die feste Absicht gehabt habe, sie auf das Konservatorium zu schicken, und dass er dies, wenn nicht das Unglück dazwischengekommen wäre."],[6322.28,6356.24,"Vergangene Weihnachten. Weihnachten war doch wohl schon vorüber. Allen gesagt hätte, ohne sich um irgendwelche Widerreden zu kümmern. Nach dieser Erklärung würde die Schwester in Tränen der Rührung ausbrechen, und Gregor würde sich bis zu ihrer Achsel erheben und ihren Hals küssen, den sie, seitdem sie ins Geschäft ging, frei, ohne Band oder Kragen trug. Herr Samsa! Rief der mittlere Herr dem Vater zu und zeigte, ohne ein weiteres Wort zu verlieren, mit dem Zeigefinger auf den langsam sich vorwärts bewegenden Gregor."],[6356.32,6389.52,"Die Violine verstummte. Der mittlere Zimmerherr lächelte erst einmal kopfschüttelnd seinen Freunden zu und sah dann wieder auf Gregor hin. Der Vater schien es für nötiger zu halten, statt Gregor zu vertreiben, vorerst die Zimmerherren zu beruhigen. Trotzdem diese gar nicht aufgeregt waren und Gregor sie mehr als das Violinspiel zu unterhalten schien. Er eilte zu ihnen und suchte sie mit ausgebreiteten Armen in ihr Zimmer zu drängen und gleichzeitig mit seinem Körper ihnen den Ausblick auf Gregor zu nehmen."],[6389.6,6437.88,"Sie wurden nun tatsächlich ein wenig böse. Man wusste nicht mehr, ob über das Benehmen des Vaters oder über die ihnen jetzt aufgehende Erkenntnis, ohne es zu wissen, einen solchen Zimmernachbar wie Gregor besessen zu haben. Sie verlangten vom Vater Erklärungen, hoben ihrerseits die Arme, zupfte unruhig an ihren Bärten und wichen nur langsam gegen ihr Zimmer zurück. Inzwischen hatte die Schwester die Verlorenheit, in die sie nach dem plötzlich abgebrochenen Spiel verfallen war, überwunden, hatte sich, nachdem sie eine Zeit lang in den lässig hängenden Händen Violine und Bogen gehalten und weiter, als Spiele sie noch in die Noten gesehen hatte, mit einem Male aufgerafft hatte das Instrument auf den Schoss der Mutter gelegt, die in Atembeschwerden mit heftig"],[6437.88,6461.16,"arbeitenden Lungen noch auf ihrem Sessel saß und war in das Nebenzimmer gelaufen, dem sich die Zimmerherren unter dem Drängen des Vaters schon schneller näherten. Man sah, wie unter den geübten Händen der Schwester die Decken und Polster in den Betten in die Höhe flogen und sich ordneten. Noch ehe die Herren das Zimmer erreicht hatten, war sie mit dem Aufbetten fertig und schlüpfte heraus."],[6461.24,6486.12,"Der Vater schien wieder von seinem Eigensinn derartig ergriffen, dass er jeden Respekt vergaß, den er seinen Mietern immerhin schuldete. Er drängte nur und drängte, bis schon in der Tür des Zimmers der mittlere, der Herrn donnernd mit dem Fuß aufstampfte und dadurch den Vater zum Stehen brachte. Ich erkläre hiermit, sagte er. Er hob die Hand und suchte mit den Blicken auch die Mutter und die Schwester."],[6486.2,6512.4,"Daß ich mit Rücksicht auf die in dieser Wohnung und Familie herrschenden widerlichen Verhältnisse hierbei spie er kurz entschlossen auf den Boden mein Zimmer. Augenblicklich kündige. Ich werde natürlich auch für die Tage, die ich hier gewohnt habe, nicht das geringste bezahlen. Dagegen werde ich es mir noch überlegen, ob ich nicht mit irgendwelchen. Glauben Sie mir sehr leicht zu begründenden Forderungen gegen Sie auftreten werde."],[6512.48,6537.4,"Er schwieg und sah gerade vor sich hin, als erwarte er etwas. Tatsächlich fielen sofort seine zwei Freunde mit den Worten ein Auch wir kündigen augenblicklich. Darauf faßte er die Türklinke und schloss mit einem Krach die Tür. Der Vater wankte mit tastenden Händen zu seinem Sessel und ließ sich in ihn fallen. Es sah aus, als strecke er sich zu seinem gewöhnlichen Abend Schläfchen."],[6537.48,6570.0,"Aber das starke Nicken seines wie haltlosen Kopfes zeigte, dass er ganz und gar nicht schlief. Gregor war die ganze Zeit still auf dem Platz gelegen, auf dem ihn die Zimmer herren ertappt hatten. Die Enttäuschung über das Mißlingen seines Planes, vielleicht aber auch die durch das viele Hungern verursachte Schwäche machten es ihm unmöglich, sich zu bewegen. Er fürchtete mit einer gewissen Bestimmtheit schon für den nächsten Augenblick einen allgemeinen, über ihn sich entladenden Zusammensturz und wartete."],[6570.08,6598.28,"Nicht einmal die Violine schreckte ihn auf, die unter den zitternden Fingern der Mutter hervor, ihr vom Schoße fiel und einen hallenden Ton von sich gab. Liebe Eltern! Sagte die Schwester und schlug zur Einleitung mit der Hand auf den Tisch. So geht es nicht weiter. Wenn Ihr das vielleicht nicht einsieht. Ich sehe es ein. Ich will vor diesem Untier nicht den Namen meines Bruders aussprechen und sage daher bloß Wir müssen versuchen, es loszuwerden."],[6598.36,6623.0,"Wir haben das Menschenmögliche versucht, es zu pflegen und zu dulden. Ich glaube, es kann uns niemand den geringsten Vorwurf machen. Sie hat tausendmal recht, sagte der Vater für sich. Die Mutter, die noch immer nicht genug Atem finden konnte, fing in die vorgehaltener Hand mit einem irrsinnigen Ausdruck der Augen dumpf zu husten an, die Schwester eilte zur Mutter und hielt ihr die Stirn."],[6623.08,6647.44,"Der Vater schien durch die Worte der Schwester auf bestimmtere Gedanken gebracht zu sein, hatte sich aufrecht gesetzt, spielte mit seiner Dienermütze zwischen den Tellern, die noch vom Nachtmahl der Zimmerherren her auf dem Tische lagen, und sah bisweilen auf den stillen Gregor hin. Wir müssen es loszuwerden suchen, sagte die Schwester nun ausschließlich zum Vater, denn die Mutter hörte in ihrem Husten nichts."],[6647.52,6667.88,"Es bringt Euch noch beide um. Ich sehe, es kommen. Wenn man schon so schwer arbeiten muss wie wir alle. Kann man nicht noch zu Hause diese ewige Quälerei ertragen? Ich kann es auch nicht mehr. Und sie brach so heftig in Weinen aus, dass ihre Tränen auf das Gesicht der Mutter niederflossen, von dem sie sie mit mechanischen Handbewegungen wischte."],[6668.12,6695.64,"Kind, sagte der Vater mitleidig und mit auffallendem Verständnis, was sollen wir aber tun? Die Schwester zuckte nur die Achseln zum Zeichen der Ratlosigkeit, die sie nun während des Weinens im Gegensatz zu ihrer früheren Sicherheit ergriffen hatte. Wenn er uns verstünde, sagte der Vater halb fragend. Die Schwester schüttelte aus dem Weinen heraus heftig die Hand, zum Zeichen, dass daran nicht zu denken sei."],[6695.72,6720.4,"Wenn er uns verstünde! Wiederholte der Vater und nahm durch Schließen der Augen die Überzeugung der Schwester von der Unmöglichkeit dessen in sich auf. Dann wäre vielleicht ein Übereinkommen mit ihm möglich. Aber so weg muß es! Rief die Schwester. Das ist das einzige Mittel, Vater! Du mußt bloß den Gedanken loszuwerden suchen, dass es Gregor ist, dass wir es so lange geglaubt haben."],[6720.56,6748.76,"Das ist ja unser eigentliches Unglück. Aber wie kann es denn Gregor sein, wenn es Gregor wäre? Er hätte längst eingesehen, dass ein Zusammenleben von Menschen mit einem solchen Tier nicht möglich ist, und wäre freiwillig fortgegangen. Wir hätten dann keinen Bruder. Aber könnten weiterleben und sein Andenken in Ehren halten. So aber verfolgt uns dieses Tier, Vertreibt die Zimmerherren, will offenbar die ganze Wohnung einnehmen und uns auf der Gasse übernachten lassen."],[6748.84,6774.8,"Sieh nur, Vater! Schrie sie plötzlich auf. Er fängt schon wieder an, und in einem für Gregor gänzlich unverständlichen Schrecken verließ die Schwester sogar die Mutter stieß sich förmlich von ihrem Sessel ab, als wollte sie lieber die Mutter opfern, als in Gregors Nähe bleiben, und eilte hinter den Vater, der lediglich durch ihr Benehmen erregt, auch aufstand und die Arme wie zum Schutze der Schwester vor ihr halb erhob."],[6774.96,6799.04,"Aber Gregor fiel es doch gar nicht ein, irgend jemandem und gar seiner Schwester Angst machen zu wollen. Er hatte bloß angefangen, sich umzudrehen, um in sein Zimmer zurück zu wandern, und das nahm sich allerdings auffallend aus, da er infolge seines leidenden Zustandes bei den schwierigen Umdrehungen mit seinem Kopfe nachhelfen mußte, den er hierbei viele Male hob und gegen den Boden schlug."],[6799.12,6826.32,"Er hielt inne und sah sich um. Seine gute Absicht schien erkannt worden zu sein. Es war nur ein augenblicklicher Schrecken gewesen. Nun sahen ihn alle schweigend und traurig an, die Mutter lag, die Beine ausgestreckt und aneinandergedrückt in ihrem Sessel. Die Augen fielen ihr vor Ermattung fast zu. Der Vater und die Schwester saßen nebeneinander. Die Schwester hatte ihre Hand um des Vaters Hals gelegt."],[6826.4,6860.28,"Nun darf ich mich schon vielleicht umdrehen, dachte Gregor und begann seine Arbeit wieder. Er konnte das Schnaufen der Anstrengung nicht unterdrücken und mußte auch hier und da ausruhen. Im übrigen drängte ihn auch niemand. Es war alles ihm selbst überlassen. Als er die Umdrehung vollendet hatte, fing er sofort an, geradeaus zurückzuwandern. Es staunte über die große Entfernung, die ihn von seinem Zimmer trennte, und begriff gar nicht, wie er bei seiner Schwäche für kurze Zeit den gleichen Weg, fast ohne es zu merken, zurückgelegt hatte."],[6860.36,6886.48,"Immerfort nur auf rasches Kriechen bedacht, achtete er kaum darauf, dass kein Wort, kein Ausruf seiner Familie ihn störte. Erst als er schon in der Tür war, wendete er den Kopf nicht vollständig, denn er fühlte den Hals steif werden. Immerhin sah er noch, dass sich hinter ihm nichts verändert hatte. Nur die Schwester war aufgestanden. Sein letzter Blick streifte die Mutter, die nun völlig eingeschlafen war."],[6886.56,6909.6,"Kaum war er innerhalb seines Zimmers, wurde die Tür eiligst zugedrückt, fest verriegelt und versperrt. Über den plötzlichen Lärm hinter sich erschrak Gregor, so, dass ihm die Beinchen einknickten. Es war die Schwester, die sich so beeilt hatte. Aufrecht war sie schon dagestanden und hatte gewartet. Leichtfüßig war sie dann vorwärts gesprungen. Gregor hatte sie gar nicht kommen hören und ein."],[6909.68,6933.36,"Endlich rief sie den Eltern zu, während sie den Schlüssel im Schloss umdrehte. Und jetzt? Fragte sich Gregor und sah sich im Dunkeln um. Er machte bald die Entdeckung, dass er sich nun überhaupt nicht mehr rühren konnte. Er wunderte sich darüber nicht, eher kam es ihm unnatürlich vor, dass er sich bis jetzt tatsächlich mit diesen dünnen Beinchen hatte fortbewegen können."],[6933.44,6964.36,"Im übrigen fühlte er sich verhältnismäßig behaglich. Er hatte zwar Schmerzen im ganzen Leibe, aber ihm war, als würden sie allmählich schwächer und schwächer und würden schließlich ganz vergehen. Den verfaulten Apfel in seinem Rücken und die entzündete Umgebung, die ganz von weichem Staub bedeckt waren, spürte er schon kaum. An seine Familie dachte er mit Rührung und Liebe zurück. Seine Meinung darüber, dass er verschwinden müsse, war womöglich noch entschiedener als die seiner Schwester."],[6964.44,7000.88,"In diesem Zustand leeren und friedlichen Nachdenkens blieb er, bis die Turmuhr die dritte Morgenstunde schlug, den Anfang des allgemeinen Heller Werdens. Draußen vor dem Fenster erlebte er noch. Dann sank sein Kopf ohne seinen Willen gänzlich nieder, und aus seinen Nüstern strömte sein letzter Atem schwach hervor. Als am frühen Morgen die Bedienerin kam, vor lauter Kraft und Eile, schlug sie, wie oft man sie auch schon gebeten hatte, das zu vermeiden, alle Türen derartig zu, dass in der ganzen Wohnung von ihrem Kommen an kein ruhiger Schlaf mehr möglich war."],[7000.96,7026.84,"Fand sie bei ihrem gewöhnlichen kurzen Besuch an Gregor zuerst nichts Besonderes. Sie dachte, er liege absichtlich so unbeweglich da und spiele den Beleidigten. Sie traute ihm allen möglichen Verstand zu, weil sie zufällig den langen Besen in der Hand hielt. Suchte sie mit ihm Gregor von der Tür aus zu kitzeln. Als sich auch da kein Erfolg zeigte, wurde sie ärgerlich und stieß ein wenig in Gregor hinein."],[7026.92,7051.64,"Und erst als sie ihn ohne jeden Widerstand von seinem Platze geschoben hatte, wurde sie aufmerksam. Als sie bald den wahren Sachverhalt erkannte, machte sie große Augen, pfiff vor sich hin, hielt sich aber nicht lange auf, sondern riß die Tür des Schlafzimmers auf und rief mit lauter Stimme in das Dunkel hinein. Sehen Sie nur mal an, es ist krepiert, da liegt es ganz und gar krepiert."],[7051.72,7076.28,"Das Ehepaar Samsa saß im Ehebett aufrecht da und hatte zu tun, den Schrecken über die Bedienerin zu verwinden, ehe es dazu kam, ihre Meldung aufzufassen. Dann aber stiegen Herr und Frau Samsa, jeder auf seiner Seite, eiligst aus dem Bett. Herr Samsa warf die Decke über seine Schultern. Frau Samsa kam nur im Nachthemd hervor. So traten sie in Gregors Zimmer."],[7076.36,7101.64,"Inzwischen hatte sich auch die Tür des Wohnzimmers geöffnet, in dem Grete seit dem Einzug der Zimmerherren schlief. Sie war völlig angezogen, als hätte sie gar nicht geschlafen. Auch ihr bleiches Gesicht schien das zu beweisen. Tod? Sagte Frau Samsa. Und zwar Fragen zur Bedienerin auf, trotzdem sie doch alles selbst prüfen und sogar ohne Prüfung erkennen konnte. Das will ich meinen."],[7101.72,7130.36,"Sagte die Bedienerin und stieß zum Beweis Gregors Leiche mit dem Besen noch ein großes Stück seitwärts. Frau Samsa machte eine Bewegung, als wolle sie den Besen zurückhalten, tat es aber nicht. Nun, sagte Herr Samsa, jetzt können wir Gott danken. Er bekreuzigte sich, und die drei Frauen folgten seinem Beispiel. Grete, die kein Auge von der Leiche wendete, sagte Seht nur, wie mager er war."],[7130.44,7162.0,"Er hat ja auch schon so lange Zeit nichts gegessen. So wie die Speisen hereinkamen, sind sie wieder hinaus gekommen. Tatsächlich war Gregors Körper vollständig flach und trocken. Man erkannte das eigentlich erst jetzt, da er nicht mehr von den Beinchen gehoben war und auch sonst nichts den Blick ablenkte. Konkrete auf ein Veilchen zu uns herein, sagte Frau Samsa mit einem wehmütigen Lächeln und Grete ging nicht ohne nach der Leiche zurück zu sehen, hinter den Eltern in das Schlafzimmer."],[7162.08,7190.6,"Die Bedienerin schloss die Tür und öffnete gänzlich das Fenster. Trotz des frühen Morgens war der frischen Luft schon etwas Lauigkeit beigemischt. Es war eben schon Ende März. Aus ihrem Zimmer traten die drei Zimmer herein und sahen sich erstaunt nach ihrem Frühstück um. Man hatte sie vergessen. Wo ist das Frühstück? Fragte der Mittlere der Herren mürrisch die Bedienerin. Diese aber legte den Finger an den Mund und winkte dann hastig und schweigend den Herren zu."],[7190.84,7218.2,"Sie möchten in Gregors Zimmer kommen? Sie kamen auch und standen dann, die Hände in den Taschen ihrer etwas abgenutzten Röckchen in dem nun schon ganz hellen Zimmer um Gregors Leiche herum. Da öffnete sich die Tür des Schlafzimmers, und Herr Samsa erschien in seiner Livree an einem Arm seine Frau am anderen seine Tochter. Alle waren ein wenig verweint. Grete drückte bisweilen ihr Gesicht an den Arm des Vaters."],[7218.28,7243.52,"Verlassen Sie sofort meine Wohnung! Sagte Herr Samsa und zeigte auf die Tür, ohne die Frauen von sich zu lassen. Wie meinen Sie das? Sagte der Mittlere der Herren etwas bestürzt und lächelte süßlich. Die zwei anderen hielten die Hände auf dem Rücken und rieben sie ununterbrochen aneinander, wie in freudiger Erwartung eines großen Streites, der aber für sie günstig ausfallen mußte."],[7243.6,7273.56,"Ich meine es genau so, wie ich es sage, antwortete Herr Samsa und ging in einer Linie mit seinen zwei Begleiterinnen auf den Zimmerherrn zu. Dieser stand zuerst still da und sah zu Boden, als ob sich die Dinge in seinem Kopf zu einer neuen Ordnung zusammenstellten. Dann gehen wir also. Sagte er dann und sah zu Herrn Samsa auf, als verlange er in einer plötzlich ihn überkommenen Demut sogar für diesen Entschluss eine neue Genehmigung."],[7273.64,7306.88,"Herr Samsa nickte ihm bloß mehrmals kurz mit großen Augen zu. Daraufhin ging der Herr tatsächlich sofort mit langen Schritten ins Vorzimmer. Seine beiden Freunde hatten schon ein Weilchen lang mit ganz ruhigen Händen aufgehorcht und hüpften ihm jetzt geradezu nach. Wie in Angst, Herr Samsa könnte vor Ihnen ins Vorzimmer eintreten und die Verbindung mit Ihrem Führer stören. Im Vorzimmer nahmen alle drei die Hüte vom Kleiderrechen, zogen ihre Stöcke aus dem Stock, Behälter verbeugten sich stumm und verließen die Wohnung."],[7306.96,7351.12,"In einem, wie sich zeigte, gänzlich unbegründeten Misstrauen trat Herr Samsa mit den zwei Frauen auf den Vorplatz hinaus. An das Geländer gelehnt, sahen sie zu, wie die drei Herren zwar langsam, aber ständig die lange Treppe hinunterstiegen, in jedem Stockwerk in einer bestimmten Biegung des Treppenhauses verschwanden und nach ein paar Augenblicken wieder hervorkamen. Je tiefer sie gelangten, desto mehr verlor sich das Interesse der Familie Samsa für sie, und als ihnen entgegen und dann hoch über sie hinweg ein Fleischergeselle mit der Trage auf dem Kopf in stolzer Haltung heraufstieg, verließ bald Herr Samsa mit den Frauen das Geländer, und alle kehrten wie erleichtert in ihre Wohnung zurück."],[7351.2,7380.4,"Sie beschlossen, den heutigen Tag zum Ausruhen und Spazierengehen zu verwenden. Sie hatten diese Arbeitsunterbrechung nicht nur verdient, sie brauchten sie sogar unbedingt. Und so setzten sie sich zum Tisch und schrieben drei Entschuldigungsbriefe. Herr Samsa, an seine Direktion, Frau Samsa an ihren Auftraggeber und Grete an ihren Prinzipal. Während des Schreibens kam die Bedienerin herein, um zu sagen, dass sie fortgehe, denn ihre Morgenarbeit war beendet."],[7380.48,7412.4,"Die drei Schreibenden nickten zuerst, bloß, ohne aufzuschauen. Erst als die Bedienerin sich immer noch nicht entfernen wollte, sah man ärgerlich auf. Nun fragte Herr Samsa. Die Bedienerin stand lächelnd in der Tür, als habe sie der Familie ein großes Glück zu melden, werde es aber nur dann tun, wenn sie gründlich ausgefragt werde. Die fast aufrechte kleine Straußfeder auf ihrem Hut, über die sich Herr Samsa schon während ihrer ganzen Dienstzeit ärgerte, schwankte leicht nach allen Richtungen."],[7412.48,7448.28,"Also, was wollen Sie eigentlich? Fragte Frau Samsa, vor welcher die Bedienerin noch am meisten Respekt hatte. Ja, antwortete die Bedienerin und konnte vor freundlichem Lachen nicht gleich weiterreden. Also darüber, wie das Zeug von nebenan weggeschafft werden soll, müssen Sie sich keine Sorgen machen. Es ist schon in Ordnung, Frau Samsa und Grete beugten sich zu ihren Briefen nieder, als wollten sie weiterschreiben, Herr Samsa, welcher merkte, dass die Bedienerin nun alles ausführlich zu beschreiben anfangen wollte, wehrte dies mit ausgestreckter Hand entschieden ab."],[7448.36,7474.64,"Da sie aber nicht erzählen durfte, erinnerte sie sich an die große Eile, die sie hatte. Rief offenbar beleidigt Atias allseits, drehte sich wild um und verließ unter fürchterlichem Türe zuschlagen die Wohnung. Abends wird sie entlassen, sagte Herr Samsa, bekam aber weder von seiner Frau noch von seiner Tochter eine Antwort, denn die Bedienerin schien ihre kaum gewonnene Ruhe wieder gestört zu haben."],[7474.72,7500.36,"Sie erhoben sich, gingen zum Fenster und blieben dort, sich umschlungen haltend. Herr Samsa drehte sich in seinem Sessel nach ihnen um und beobachtete sie still ein Weilchen. Dann rief er Also kommt doch her, lasst schon endlich die alten Sachen und nehmt doch ein wenig Rücksicht auf mich. Gleich folgten ihm die Frauen, eilten zu ihm, liebkosten ihn und beendeten rasch ihre Briefe."],[7500.44,7524.48,"Dann verließen alle drei gemeinschaftlich die Wohnung, was sie schon seit Monaten nicht getan hatten, und fuhren mit der Elektrischen ins Freie vor die Stadt. Der Wagen, in dem sie allein saßen, war ganz von warmer Sonne durch Schienen. Sie besprachen, bequem auf ihren Sitzen zurückgelehnt, die Aussichten für die Zukunft, und es fand sich, dass diese bei näherer Betrachtung durchaus nicht schlecht waren."],[7524.56,7568.52,"Denn aller drei Anstellungen waren, worüber sie einander eigentlich noch gar nicht ausgefragt hatten, überaus günstig und besonders für später vielversprechend. Die größte augenblickliche Besserung der Lage mußte sich natürlich leicht durch einen Wohnungswechsel ergeben. Sie wollten nun eine kleinere und billigere, aber besser gelegene und überhaupt praktischere Wohnung nehmen, als es die jetzige noch von Gregor ausgesuchte war. Während sie sich so unterhielten, fiel es Herrn und Frau Samsa im Anblick ihrer immer lebhafter werdenden Tochter fast gleichzeitig ein, wie sie in der letzten Zeit trotz aller Plage, die ihre Wangen bleich gemacht hatte, zu einem schönen und üppigen Mädchen aufgeblüht war."],[7568.6,7589.24,"Stiller werdend und fast unbewusst durch Blicke sich verständigen, dachten sie daran, dass es nun Zeit sein werde, auch einen braven Mann für sie zu suchen, und es war ihnen wie eine Bestätigung ihrer neuen Träume und guten Absichten. Als am Ziele ihrer Fahrt die Tochter als erste sich erhob und ihren jungen Körper dehnte."]]</script>

 {top:'#5aa9ff',bot:'#eef8ff',ground:0xdff1ff,light:1.05,bld:[0xbfe3ff,0xffffff,0x9fd0ff,0xd8ccff,0xa8f0ff]},
 {top:'#ff9a00',bot:'#fff1a8',ground:0xffc94d,light:1.0,bld:[0xff6b6b,0x4ecdc4,0xffe66d,0xa06cd5,0xffffff]},
 {top:'#1a0000',bot:'#8b1a1a',ground:0x2d3a1f,light:0.6,bld:[0x3a0d0d,0x1f2a14,0x4a1010,0x2a0a2a,0x3d2b0b],neon:true,ohio:true}, // only in Ohio
];

function hexToRgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function mixRgb(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);return A.map((v,i)=>Math.round(v+(B[i]-v)*t));}

function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}

const stripeTex=canvasTex(128,32,(g,w,h)=>{g.fillStyle='#ffffff';g.fillRect(0,0,w,h);g.fillStyle='#ff3d6e';for(let x=-h;x<w;x+=32){g.beginPath();g.moveTo(x,h);g.lineTo(x+16,0);g.lineTo(x+32,0);g.lineTo(x+16,h);g.fill();}});

function trainTex(base,stripe){return canvasTex(256,64,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);g.fillStyle=stripe;g.fillRect(0,42,w,9);g.fillStyle='#d9f3ff';for(let x=12;x<w;x+=38)rr(g,x,9,26,20,5);});}

  if(kind==='jet'){g.fillStyle='#ffd23f';g.beginPath();g.moveTo(52,92);g.lineTo(64,116);g.lineTo(76,92);g.fill();
    g.fillStyle='#ffffff';g.beginPath();g.moveTo(64,22);g.quadraticCurveTo(84,40,80,92);g.lineTo(48,92);g.quadraticCurveTo(44,40,64,22);g.fill();
    g.fillStyle='#3a86ff';g.beginPath();g.arc(64,56,9,0,7);g.fill();
    g.fillStyle='#ffd23f';g.beginPath();g.moveTo(48,72);g.lineTo(34,96);g.lineTo(48,92);g.fill();g.beginPath();g.moveTo(80,72);g.lineTo(94,96);g.lineTo(80,92);g.fill();}
  if(kind==='mag'){g.strokeStyle='#ff4d6d';g.lineWidth=20;g.beginPath();g.arc(64,58,26,Math.PI,0,true);g.stroke();
    g.beginPath();g.moveTo(38,58);g.lineTo(38,86);g.moveTo(90,58);g.lineTo(90,86);g.stroke();
    g.strokeStyle='#e8eef8';g.beginPath();g.moveTo(38,84);g.lineTo(38,96);g.moveTo(90,84);g.lineTo(90,96);g.stroke();}
  if(kind==='x2'){
    g.fillStyle='#ffd23f';g.beginPath();for(let i=0;i<10;i++){const r=i%2?18:40,a=-Math.PI/2+i*Math.PI/5;g.lineTo(64+Math.cos(a)*r,64+Math.sin(a)*r);}g.closePath();g.fill();}
});}

const chevGeo=new THREE.ShapeGeometry(chev),chevMats=[0xffd23f,0xff4fa3,0x3ff2c8].map(c=>new THREE.MeshBasicMaterial({color:c}));

const buildings=[];const bGeo=new THREE.BoxGeometry(1,1,1);

function spawnRow(z){

  const types=['empty','empty','empty'];
  const idx=[0,1,2].sort(()=>Math.random()-0.5);
  for(let i=0;i<nTrains;i++)types[idx[i]]='train';
  for(let i=0;i<3;i++)if(types[i]!=='train'){const q=Math.random();types[i]=q<0.36?'low':q<0.7?'high':'empty';}
  // at least one lane is always passable; the autopilot's lane is chosen here
  let best=-1,bestScore=1e9;
  for(let i=0;i<3;i++){if(types[i]==='train')continue;
    const s=Math.abs(i-lastChoice)*0.4+(types[i]==='empty'?0.7:0)+Math.random()*1.2;
    if(s<bestScore){bestScore=s;best=i;}}
  const choice=best;lastChoice=choice;
  const L=nTrains?14+Math.random()*8:0.5;
  const g=new THREE.Group();g.position.z=z;
  types.forEach((t,i)=>{const x=LANES[i];if(t==='train')buildTrain(g,x,L);else if(t==='low')buildLow(g,x);else if(t==='high')buildHigh(g,x);});

    grp.add(new THREE.Mesh(ringGeo,postMat));

  }
  scene.add(g);

const CAMS=[

  (x,y)=>[x*0.8,1.5+y*0.8,4.8, x*0.8,2.7+y*0.9,-10],     // low hero
  (x,y)=>[x*0.4,10.5+y*0.5,8.5, x*0.6,0.6+y*0.6,-12],    // drone
  (x,y)=>[6.8,3.4+y*0.6,3.2, x,1.3+y*0.85,-6],           // side chase
  (x,y)=>[x*0.5,6+y*0.6,11, x*0.7,1.2+y*0.8,-6],         // wide
  (x,y)=>[x*0.6,5.4+y*0.6,-8, x*0.9,1.3+y*0.9,0],        // front, looking back at the runner
];
const tmpV=new THREE.Vector3();
function animate(dt){
  const run=simT*vel*0.55;
  const sliding=slideT>0&&onGround;
  const air=!onGround;
  const flying=jet.state!=='off';
  const sw=air?0.5:sliding?0:Math.sin(run)*0.95;
  legL.rotation.x=flying?0.3:air?-0.9:sw;legR.rotation.x=flying?0.5:air?0.4:-sw;
  armL.rotation.x=flying?-0.4:air?-2.5:-sw*0.9;armR.rotation.x=flying?-0.4:air?-2.5:sw*0.9;
  body.position.y=-1.0+(air?0:Math.abs(Math.sin(run))*0.09);
  const jp=jumpT>=0?Math.min(1,jumpT/AIR):0;const ease=jp*jp*(3-2*jp);
  flip.rotation.x=flipKind===1&&jumpT>=0?-ease*Math.PI*2:0;
  flip.rotation.y=flipKind===2&&jumpT>=0?ease*Math.PI*2:0;
  flip.scale.y=sliding?0.42:1;flip.position.y=sliding?0.42:1.0;
  flip.rotation.z=0;
  body.rotation.x=sliding?0.35:flying?-0.25:0;
  jetpack.visible=flying;
  animateBrainrot(dt,flying);
  flames.forEach(f=>{f.scale.y=0.7+Math.random()*0.8;});
  player.position.set(px,py,0);
  const cur=nearestRow();
  const tx=flying?px:(cur?LANES[cur.choice]:px);
  player.rotation.z=THREE.MathUtils.clamp((tx-px)*0.14,-0.35,0.35);
  shadow.position.x=px;shadow.scale.setScalar(Math.max(0.2,1-Math.min(py,6)*0.15));
  magnetRing.visible=magnetT>0;magnetRing.position.set(px,py+1,0);magnetRing.scale.setScalar(1+Math.sin(simT*10)*0.12);
  goldAura.visible=doubleT>0;goldAura.position.set(px,py+1,0);goldAura.scale.setScalar(1+Math.sin(simT*8)*0.08);
  rows.forEach(r=>{r.coins.forEach(c=>{c.rotation.y+=dt*5;});if(r.pu){r.pu.grp.position.y=1.2+Math.sin(simT*4)*0.2;r.pu.grp.children[1].rotation.z+=dt*3;}});
  skyCoins.forEach(c=>{c.rotation.y+=dt*5;});
  const ci=flying&&(camIdx===1||camIdx===3)?0:camIdx;
  let c=CAMS[ci](px,py);
  if(orbitT>0){orbitT-=dt;const a=orbitA+(1-orbitT/2.2)*Math.PI*2;c=[px+Math.sin(a)*8,4.8+py*0.7,Math.cos(a)*8, px,1.3+py*0.9,0];}
  const k=Math.min(1,dt*(orbitT>0?6:3.2));
  camPos.lerp(tmpV.set(c[0],c[1],c[2]),k);camLook.lerp(tmpV.set(c[3],c[4],c[5]),k);
  camera.position.copy(camPos);camera.lookAt(camLook);
  camera.rotateZ((px-tx)*0.03+Math.sin(simT*0.7)*0.05);
  if(fx.roll>0){const e=1-fx.roll;camera.rotateZ(e*e*(3-2*e)*Math.PI*2);} // ohio barrel roll
  if(shake>0){camera.position.x+=(Math.random()-0.5)*shake*0.25;camera.position.y+=(Math.random()-0.5)*shake*0.25;}
  hoodie.color.setHSL((simT*0.05)%1,0.85,0.58);railMat.emissive.setHSL((simT*0.12)%1,1,0.3);
  const fovT=baseFov+(vel-20)*0.35+(flying?8:0)+fovKick+turboV*12-zoomP*22;zoomP=Math.max(0,zoomP-dt*1.5);
  camera.fov+=(fovT-camera.fov)*Math.min(1,dt*4);camera.updateProjectionMatrix();
}

const streaks=[];for(let i=0;i<80;i++)streaks.push({a:Math.random()*Math.PI*2,r:Math.random(),s:0.6+Math.random()});
function drawSpeedLines(ctx,w,h,dt){
  const k=Math.max(0,(vel-24)/20)+(jet.state!=='off'?0.5:0)+fovKick*0.04+turboV*0.9;
  for(const s of streaks){s.r+=dt*s.s*2.2;if(s.r>1){s.r=0.25;s.a=Math.random()*Math.PI*2;}}
  if(k<=0.02)return;
  const cx=w/2,cy=h*0.42,R=Math.hypot(w,h)*0.6;
  const al=Math.min(0.6,k*0.6);ctx.lineWidth=Math.max(2,w/320);
  streaks.forEach((s,i)=>{const r1=s.r*R,r2=r1+R*0.14;ctx.strokeStyle='hsla('+((i*37+simT*120)%360)+',100%,'+(i%3?75:95)+'%,'+al+')';
    ctx.beginPath();ctx.moveTo(cx+Math.cos(s.a)*r1,cy+Math.sin(s.a)*r1);ctx.lineTo(cx+Math.cos(s.a)*r2,cy+Math.sin(s.a)*r2);ctx.stroke();});
}


/* ---------- score at the top edge (optional, also burned into the MP4 when on) ---------- */
function drawScore(ctx,w,h){
  scoreShown+=(score-scoreShown)*0.3;if(Math.abs(score-scoreShown)<1)scoreShown=score;
  scoreBump*=0.82;
  const fs=Math.round(h*0.05*(1+scoreBump*0.12)),y=h*0.075;
  const txt=Math.round(scoreShown).toLocaleString('de-DE');
  ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  ctx.font='900 '+Math.round(h*0.018)+'px Nunito, "Arial Black", sans-serif';
  ctx.lineWidth=h*0.006;ctx.strokeStyle='#2a145f';const lab=brainrot?'AURA':'SCORE';ctx.strokeText(lab,w/2,y-fs*0.78);ctx.fillStyle='#ffffff';ctx.fillText(lab,w/2,y-fs*0.78);
  ctx.font='900 '+fs+'px Nunito, "Arial Black", sans-serif';
  ctx.lineWidth=fs*0.24;ctx.strokeStyle='#2a145f';ctx.strokeText(txt,w/2,y);
  const gr=ctx.createLinearGradient(0,y-fs/2,0,y+fs/2);gr.addColorStop(0,'#fff6b0');gr.addColorStop(0.55,'#ffd23f');gr.addColorStop(1,'#ff9f1c');
  ctx.fillStyle=gr;ctx.fillText(txt,w/2,y);ctx.restore();
}

/* ---------- live loop ---------- */
let paused=false,timeScale=3,last=performance.now(),bookClock=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!exporting){
    visScale=timeScale;
    if(!paused)for(let i=0;i<timeScale;i++)update(dt);
    animate(paused?0:dt*Math.min(timeScale,3));
    renderer.render(scene,camera);
    lctx.clearRect(0,0,W,H);if(!paused)drawSpeedLines(lctx,W,H,dt*timeScale);drawMemes(lctx,W,H,paused?0:dt);if(scoreOn)drawScore(lctx,W,H);
    bookClock+=dt;if(bookClock>0.25){bookClock=0;showBook();}
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- book progress (shown in the dock, never in the video) ---------- */
const bookEl=document.getElementById('book');
function showBook(){const n=CH.length||1;bookEl.textContent=collected.toLocaleString('de-DE')+' / '+n.toLocaleString('de-DE')+' Zeichen · '+Math.floor(collected/n*100)+' %';}

/* ---------- MP4 export: renders a fresh run from the first word; long runs become seamless 10-minute parts ---------- */
const $=id=>document.getElementById(id);
let loopOn=true,clipLen=30,lastBlob=null,lastName='',lastExt='mp4',cancelReq=false,downloads=null,wakeLock=null;
const PART=600;
const yieldNow=()=>new Promise(r=>{const ch=new MessageChannel();ch.port1.onmessage=()=>r();ch.port2.postMessage(0);});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function pickConfig(long){
  if(!('VideoEncoder' in window)||!window.Mp4Muxer)return null;
  const tries=[[1080,1920,'avc1.640028'],[1080,1920,'avc1.4d0028'],[1080,1920,'avc1.42e028'],[720,1280,'avc1.42e01f']];
  for(const [w,h,codec] of tries){
    const cfg={codec,width:w,height:h,bitrate:long?(w>720?6_000_000:4_000_000):(w>720?10_000_000:6_000_000),framerate:30,avc:{format:'avc'}};
    try{const s=await VideoEncoder.isConfigSupported(cfg);if(s.supported)return cfg;}catch(e){}
  }
  return null;
}
function setProgress(f,txt){$('progBar').style.width=Math.round(Math.max(0,Math.min(1,f))*100)+'%';$('progTxt').textContent=txt||Math.round(f*100)+' %';}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());}
async function offerSave(blob,name){
  if(!downloads){ // outside claude.ai (e.g. the page saved as a file): plain browser download
    try{const u=URL.createObjectURL(blob);const el=document.createElement('a');el.href=u;el.download=name;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);return 'saved';}catch(e){return 'unavailable';}}
  try{await downloads.save({filename:name,data:blob});return 'saved';}
  catch(e){return (e&&e.code)||'unavailable';}
}
function renderFrame(comp,cctx,OW,OH,FPS,steps){
  visScale=steps;for(let k=0;k<steps;k++)update(1/FPS);
  animate(Math.min(steps,3)/FPS);renderer.render(scene,camera);
  const g=cctx.createLinearGradient(0,0,0,OH);g.addColorStop(0,'rgb('+skyTop+')');g.addColorStop(1,'rgb('+skyBot+')');
  cctx.fillStyle=g;cctx.fillRect(0,0,OW,OH);cctx.drawImage(canvas,0,0,OW,OH);drawSpeedLines(cctx,OW,OH,steps/FPS);drawMemes(cctx,OW,OH,1/FPS);if(scoreOn)drawScore(cctx,OW,OH);
}
async function renderPart(cfg,frames,FPS,steps,comp,cctx,onFrame,loopK){
  // loop clips: the first frames are kept and blended into the last ones, so the end flows straight into the start
  const saved=[];
  for(let j=0;j<(loopK||0);j++){renderFrame(comp,cctx,cfg.width,cfg.height,FPS,steps);const c=document.createElement('canvas');c.width=cfg.width;c.height=cfg.height;c.getContext('2d').drawImage(comp,0,0);saved.push(c);}
  const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:cfg.width,height:cfg.height,frameRate:FPS},fastStart:false});
  let failed=null;
  const encoder=new VideoEncoder({output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta),error:e=>{failed=e;}});
  encoder.configure(cfg);
  for(let i=0;i<frames;i++){
    if(cancelReq||failed)break;
    renderFrame(comp,cctx,cfg.width,cfg.height,FPS,steps);
    if(loopK&&i>=frames-loopK){const j=i-(frames-loopK);cctx.globalAlpha=(j+1)/loopK;cctx.drawImage(saved[j],0,0);cctx.globalAlpha=1;}
    const vf=new VideoFrame(comp,{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});
    encoder.encode(vf,{keyFrame:i%(FPS*2)===0});vf.close();
    while(encoder.encodeQueueSize>6)await yieldNow();
    if(i%6===0){onFrame(i);await yieldNow();}
  }
  if(failed){try{encoder.close();}catch(e){}throw failed;}
  if(cancelReq){try{encoder.close();}catch(e){}return null;}
  await encoder.flush();encoder.close();muxer.finalize();
  return new Blob([muxer.target.buffer],{type:'video/mp4'});
}
async function exportVideo(){
  if(exporting)return;
  const total=clipLen,long=total>60,steps=timeScale;
  const parts=long?Math.ceil(total/PART):1,partLen=long?Math.min(PART,total):total;
  exporting=true;cancelReq=false;lastBlob=null;
  $('make').disabled=true;$('save').hidden=true;$('prog').hidden=false;$('cancel').hidden=false;setProgress(0,'Startet …');
  try{if(navigator.wakeLock)wakeLock=await navigator.wakeLock.request('screen');}catch(e){wakeLock=null;}
  const cfg=await pickConfig(long);
  const FPS=30;
  const wasPortrait=stage.classList.contains('portrait');stage.classList.add('portrait');
  const OW=cfg?cfg.width:1080,OH=cfg?cfg.height:1920;
  renderer.setPixelRatio(1);renderer.setSize(OW,OH,false);camera.aspect=OW/OH;baseFov=80;camera.fov=80;camera.updateProjectionMatrix();
  lctx.clearRect(0,0,lines.width,lines.height);
  const comp=document.createElement('canvas');comp.width=OW;comp.height=OH;const cctx=comp.getContext('2d');
  reset();
  const id=stamp();let msg=null;
  try{
    if(cfg){
      for(let p=0;p<parts;p++){
        const frames=Math.round(Math.min(partLen,total-p*PART)*FPS);
        const label=parts>1?'Teil '+(p+1)+'/'+parts+' · ':'';
        const t0=performance.now();
        const blob=await renderPart(cfg,frames,FPS,steps,comp,cctx,i=>{
          const el=(performance.now()-t0)/1000,rate=i>30?i/el:0,left=rate?(frames-i)/rate:0;
          setProgress((p+i/frames)/parts,label+Math.round(i/frames*100)+' %'+(left>20?' · noch ca. '+Math.ceil(left/60)+' min':''));showBook();},(parts===1&&loopOn)?15:0);
        if(!blob)break;
        const name='verwandlung-'+id+'-'+(parts>1?'teil'+String(p+1).padStart(2,'0')+'von'+parts:total+'s')+'.mp4';
        if(parts===1){lastBlob=blob;lastName=name;break;}
        setProgress((p+1)/parts,label+'bitte Speichern bestätigen');
        const res=await offerSave(blob,name);
        if(res!=='saved'){lastBlob=blob;lastName=name;msg=label+'nicht gespeichert, Serie angehalten';break;}
      }
      if(!lastBlob&&!cancelReq&&parts>1)msg='Alle '+parts+' Teile gespeichert';
    }else{
      if(long)throw new Error('Lange Videos gehen nur in Chrome oder Edge am Computer.');
      if(!comp.captureStream||!window.MediaRecorder)throw new Error('Dieser Browser kann hier kein Video erzeugen. Probiere Chrome oder Edge am Computer.');
      const mime=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
      const chunks=[];const rec=new MediaRecorder(comp.captureStream(FPS),{mimeType:mime,videoBitsPerSecond:10_000_000});
      rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};rec.start(1000);
      const N=total*FPS,t0=performance.now();
      for(let i=0;i<N&&!cancelReq;i++){renderFrame(comp,cctx,OW,OH,FPS,steps);
        const wait=t0+(i+1)*1000/FPS-performance.now();if(wait>0)await sleep(wait);
        if(i%6===0)setProgress(i/N,Math.round(i/N*100)+' % (Echtzeit)');}
      await new Promise(r=>{rec.onstop=r;rec.stop();});
      if(!cancelReq){lastExt=mime.includes('mp4')?'mp4':'webm';lastBlob=new Blob(chunks,{type:mime});lastName='verwandlung-'+id+'-'+total+'s.'+lastExt;}
    }
  }catch(e){msg=(e&&e.message)?e.message:'Video konnte nicht erstellt werden.';lastBlob=null;}
  try{if(wakeLock)await wakeLock.release();}catch(e){}wakeLock=null;
  exporting=false;if(!wasPortrait)stage.classList.remove('portrait');resize();
  $('make').disabled=false;$('cancel').hidden=true;$('make').textContent='Neues Video';
  if(lastBlob){$('save').hidden=false;setProgress(1,msg||(lastBlob.size/1048576).toFixed(1)+' MB fertig');}
  else if(msg)setProgress(msg.startsWith('Alle')?1:0,msg);
  else if(cancelReq)$('prog').hidden=true;
}
async function saveVideo(){
  if(!lastBlob)return;
  const res=await offerSave(lastBlob,lastName);
  setProgress(1,res==='saved'?'Gespeichert':res==='declined'?'Nicht gespeichert':res==='rate_limited'?'Kurz warten, dann nochmal':res==='too_large'?'Zu groß – kürzere Länge wählen':'Speichern hier nicht möglich');
}
