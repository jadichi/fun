<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: a text-free 9:16 game stage (the part that ends up in the video; only the score is drawn, memes live in the 3D world); all controls live in a dock below it */
:root{
  --frame:#1a1240;      /* letterbox around the stage */
  --dock:#22175acc;     /* control dock */
  --btn:#3a2585;
  --gold:#ffd23f;       /* main accent */
  --mint:#3ff2c8;       /* progress */
  --ink:#ffffff;
  --muted:#c9bff0;
  --body:"Nunito",system-ui,sans-serif;
  color-scheme: dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--frame);color:var(--ink);font-family:var(--body);font-weight:800}
#stage{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100vw;overflow:hidden;background:linear-gradient(#3fb7ff,#bff0ff)}
#stage.portrait{width:min(100vw,calc(100vh * 9 / 16));box-shadow:0 0 0 1px #ffffff22,0 20px 80px #0008}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#lines{pointer-events:none}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;background:var(--dock);border-radius:14px;padding:8px;pointer-events:auto;backdrop-filter:blur(8px);max-width:100%}
.sep{width:1px;height:24px;background:#ffffff26}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding-inline:4px}
button{font-family:var(--body);font-weight:900;font-size:13px;color:var(--ink);background:var(--btn);border:0;border-radius:9px;padding:9px 12px;cursor:pointer;box-shadow:inset 0 -3px 0 #0003}
button:hover{background:#4a31a6}
button[aria-pressed="true"]{background:var(--gold);color:#2a145f}
button.go{background:var(--gold);color:#2a145f}
button.go:hover{background:#ffe066}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;font-variant-numeric:tabular-nums}
.bar{width:140px;height:8px;border-radius:4px;background:#ffffff26;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mint)}
body.clean .dock{display:none}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);font-size:12px;background:#000a;padding:6px 12px;border-radius:999px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#hint.on{opacity:1}
</style>

<div id="stage" class="portrait">

<script type="application/json" id="bookdata">[[0.08,35.16,"Als Gregor Samsa eines Morgens aus unruhigen Träumen erwachte, fand er sich in seinem Bett zu einem ungeheueren Ungeziefer verwandelt. Er lag auf seinem panzerartig harten Rücken und sah, wenn er den Kopf ein wenig hob, seinen gewölbten braunen von bogenförmigen Versteifungen geteilten Bauch, auf dessen Höhe sich die Bettdecke zum gänzlichen Niedergleiten bereit, kaum noch erhalten konnte. Seine vielen, im Vergleich zu seinem sonstigen Umfang kläglich dünnen Beine flimmerten ihm hilflos vor den Augen."],[35.24,63.52,"Was ist mit mir geschehen, dachte er. Es war kein Traum. Sein Zimmer. Ein richtiges, nur etwas zu kleines Menschenzimmer, lag ruhig zwischen den vier wohlbekannten Wänden über dem Tisch, auf dem eine auseinander gepackte Musterkollektion von Tuchwaren ausgebreitet war. Samsa war Reisender. Hing das Bild, das er vor kurzem aus einer illustrierten Zeitschrift ausgeschnitten und in einem hübschen vergoldeten Rahmen untergebracht hatte."],[63.6,91.04,"Es stellte eine Dame dar, die mit einem Pelz hut und einer Pelzboah versehen, aufrecht dasaß und einen schweren Pelz muff, in dem ihr ganzer Unterarm verschwunden war, dem Beschauer entgegenhob. Gregors Blick richtete sich dann zum Fenster, und das trübe Wetter? Man hörte Regentropfen auf das Fenster. Blech aufschlagen, machte ihn ganz melancholisch. Wie wäre es, wenn ich noch ein wenig weiter schliefe und alle Narrheiten vergesse?"],[91.12,121.56,"Dachte er. Aber das war gänzlich undurchführbar, denn er war gewöhnt, auf der rechten Seite zu schlafen, konnte sich aber in seinem gegenwärtigen Zustand nicht in diese Lage bringen. Mit welcher Kraft er sich auch auf die rechte Seite warf, immer wieder schaukelte er in die Rückenlage zurück. Er versuchte es wohl hundertmal, schloss die Augen, um die zappelnden Beine nicht sehen zu müssen, und ließ erst ab, als er in der Seite einen noch nie gefühlten, leichten, dumpfen Schmerz zu fühlen begann."],[121.64,151.96,"Ach Gott, dachte er, was für einen anstrengenden Beruf habe ich gewählt? Tagaus, tagein auf der Reise. Die geschäftlichen Aufregungen sind viel größer als im eigentlichen Geschäft zu Hause. Und außerdem ist mir noch diese Plage des Reisens auferlegt. Die Sorgen um die Zuganschlüsse, das unregelmäßige schlechte Essen, ein immer wechselnder, nie andauernder, nie herzlich werdender menschlicher Verkehr. Der Teufel soll das alles holen."],[152.04,175.2,"Er fühlte ein leichtes Jucken oben auf dem Bauch, schob sich auf dem Rücken langsam näher zum Bettpfosten. Um den Kopf besser heben zu können, fand die juckende Stelle, die mit lauter kleinen weißen Pünktchen besetzt war, die er nicht zu beurteilen verstand und wollte mit einem Bein die Stelle betasten, zog es aber gleich zurück, denn bei der Berührung umwehte ihn Kälteschauer."],[175.28,202.2,"Er glitt wieder in seine frühere Lage zurück. Dies frühzeitige Aufstehen, dachte er, macht einen ganz blödsinnig. Der Mensch muss seinen Schlaf haben. Andere Reisende leben wie Harems Frauen. Wenn ich zum Beispiel im Laufe des Vormittags ins Gasthaus zurückgehe, um die erlangten Aufträge zu überschreiben, sitzen diese Herren erst beim Frühstück. Das sollte ich bei meinem Chef versuchen. Ich würde auf der Stelle hinausfliegen."],[202.28,229.2,"Wer weiß übrigens, ob das nicht sehr gut für mich wäre, wenn ich mich nicht wegen meiner Eltern zurück hielte. Ich hätte längst gekündigt. Ich wäre vor den Chef hingetreten und hätte ihm meine Meinung von Grund des Herzens ausgesagt. Vom Pult hätte er fallen müssen. Es ist auch eine sonderbare Art, sich auf das Pult zu setzen und von der Höhe herab mit dem Angestellten zu reden, der überdies wegen der Schwerhörigkeit des Chefs ganz nahe herantreten muss."],[229.28,251.68,"Nun, die Hoffnung ist noch nicht gänzlich aufgegeben. Habe ich einmal das Geld beisammen, um die Schuld der Eltern an ihn abzuzahlen. Es dürfte noch 5 bis 6 Jahre dauern. Mache ich die Sache unbedingt. Dann wird der große Schnitt gemacht. Vorläufig allerdings muss ich aufstehen, denn mein Zug fährt um fünf. Und er sah zur Wegur hinüber, die auf dem Kasten tickte."],[251.76,282.28,"Himmlischer Vater, dachte er. Es war 6:30 uhr, und die Zeiger gingen ruhig vorwärts. Es war sogar halb vorüber. Es näherte sich schon 3/4. Sollte der Wecker nicht geläutet haben? Man sah vom Bett aus, dass er auf 4:00 richtig eingestellt war. Gewiss hatte er auch geläutet. Ja. Aber war es möglich, dieses Möbel erschütternde Läuten ruhig zu verschlafen? Nun, ruhig hatte er ja nicht geschlafen, aber wahrscheinlich desto fester."],[282.36,308.44,"Was aber sollte er jetzt tun? Der nächste Zug ging um 7:00. Um den einzuholen, hätte er sich unsinnig beeilen müssen und die Kollektion war noch nicht eingepackt. Und er selbst fühlte sich durchaus nicht besonders frisch und beweglich. Und selbst wenn er den Zug einholte ein Donnerwetter des Chefs war nicht zu vermeiden, denn der Geschäftsdiener hatte beim 5:00 Zug gewartet und die Meldung von seiner Versäumnis längst erstattet."],[308.52,339.08,"Es war eine Kreatur des Chefs ohne Rückgrat und Verstand. Wie nun, wenn er sich krank meldete? Das wäre aber äußerst peinlich und verdächtig, denn Gregor war während seines 5-jährigen Dienstes noch nicht einmal krank gewesen. Gewiss würde der Chef mit dem Krankenkassenarzt kommen, würde den Eltern wegen des faulen Sohnes Vorwürfe machen und alle Einwände durch den Hinweis auf den Krankenkassenarzt abschneiden, für den es ja überhaupt nur ganz gesunde, aber arbeitsscheue Menschen gibt."],[339.28,366.6,"Und hätte er übrigens in diesem Falle so ganz unrecht. Gregor fühlte sich tatsächlich abgesehen von einer nach dem langen Schlaf wirklich überflüssigen Schläfrigkeit, ganz wohl und hatte sogar einen besonders kräftigen Hunger, als er dies alles in größter Eile überlegte, ohne sich entschließen zu können, das Bett zu verlassen. Gerade schlug der Wecker, 3/4 sieben klopfte es vorsichtig an die Tür am Kopfende seines Bettes."],[366.68,398.0,"Gregor! Rief es. Es war die Mutter. Es ist 3/4 sieben. Wolltest du nicht wegfahren? Die sanfte Stimme. Gregor erschrak, als er seine antwortende Stimme hörte, die wohl unverkennbar seine frühere war, in die sich aber wie von unten her ein nicht zu Unterdrücken des schmerzliches Piepsen mischte, das die Worte förmlich nur im ersten Augenblick in ihrer Deutlichkeit beließ, um sie im Nachklang derart zu zerstören, dass man nicht wußte, ob man recht gehört hatte."],[398.08,429.64,"Gregor hatte ausführlich Antworten und alles erklären wollen, beschränkte sich aber bei diesen Umständen darauf, zu sagen Ja, ja! Danke, Mutter, ich stehe schon auf. Infolge der Holztür war die Veränderung in Gregors Stimme draußen wohl nicht zu merken, denn die Mutter beruhigte sich mit dieser Erklärung und schlürfte davon. Aber durch das kleine Gespräch waren die anderen Familienmitglieder darauf aufmerksam geworden, dass Gregor wider Erwarten noch zu Hause war und schon klopfte an der einen Seitentür."],[429.68,465.76,"Der Vater schwach, aber mit der Faust. Gregor! Gregor! Rief er. Was ist denn? Und nach einer kleinen Weile mahnte er nochmals mit tieferer Stimme. Gregor! Gregor! An der anderen Seitentür aber klagte leise die Schwester. Gregor, ist dir nicht wohl? Brauchst du etwas? Nach beiden Seiten hin antwortete Gregor Bin schon fertig. Und bemühte sich, durch die sorgfältigste Aussprache und durch Einschaltung von langen Pausen zwischen den einzelnen Worten seiner Stimme alles Auffallende zu nehmen."],[465.84,491.96,"Der Vater kehrte auch zu seinem Frühstück zurück. Die Schwester aber flüsterte Gregor, mach auf! Ich beschwöre dich! Gregor aber dachte gar nicht daran aufzumachen, sondern lobte die vom Reisen her übernommene Vorsicht, auch zu Hause alle Türen während der Nacht zu versperren. Zunächst wollte er ruhig und ungestört aufstehen, sich anziehen und vor allem frühstücken und dann erst das weitere Überlegen."],[492.04,523.88,"Denn das merkte er wohl im Bett würde er mit dem Nachdenken zu keinem vernünftigen Ende kommen. Er erinnerte sich schon öfters im Bett irgendeinen vielleicht durch ungeschicktes Liegen erzeugten leichten Schmerz empfunden zu haben, der sich dann beim Aufstehen als reine Einbildung herausstellte. Und er war gespannt, wie sich seine heutigen Vorstellungen allmählich auflösen würden. Dass die Veränderung der Stimme nichts anderes war als der Vorbote einer tüchtigen Verkühlung, einer Berufskrankheit der Reisenden."],[523.96,551.08,"Daran zweifelte er nicht im Geringsten. Die Decke abzuwerfen war ganz einfach. Er brauchte sich nur ein wenig aufzublasen, und sie fiel von selbst. Aber weiterhin wurde es schwierig, besonders, weil er so ungemein breit war. Er hätte Arme und Hände gebraucht, um sich aufzurichten. Stattdessen aber hatte er nur die vielen Beinchen, die ununterbrochen in der verschiedensten Bewegung waren und die er überdies nicht beherrschen konnte."],[551.16,575.8,"Wollte er eines einmal einknicken, so war es das erste, dass es sich streckte, und gelang es ihm, endlich mit diesem Bein das auszuführen, was er wollte. So arbeiteten inzwischen alle anderen wie freigelassen, in höchster, schmerzlicher Aufregung. Nur sich nicht im Bett unnütz aufhalten. Sagte sich Gregor. Zuerst wollte er mit dem unteren Teil seines Körpers aus dem Bett hinauskommen."],[575.88,608.56,"Aber dieser untere Teil, den er übrigens noch nicht gesehen hatte und von dem er sich auch keine rechte Vorstellung machen konnte, erwies sich als zu schwer beweglich. Es ging so langsam. Und als er schließlich, fast wild geworden, mit gesammelter Kraft, ohne Rücksicht sich vorwärts stieß, hatte er die Richtung falsch gewählt, schlug an den unteren Bettpfosten heftig an, und der brennende Schmerz, den er empfand, belehrte ihn, dass gerade der untere Teil seines Körpers augenblicklich vielleicht der empfindlichste war."],[608.64,631.72,"Er versuchte es daher zuerst, den Oberkörper aus dem Bett zu bekommen und drehte vorsichtig den Kopf dem Bettrand zu. Dies gelang auch leicht und trotz ihrer Breite und Schwere folgte schließlich die Körpermasse langsam der Wendung des Kopfes. Aber als er den Kopf endlich außerhalb des Bettes in der freien Luft hielt, bekam er Angst, weiter auf diese Weise vorzurücken."],[631.8,644.96,"Denn wenn er sich schließlich so fallen ließ, mußte geradezu ein Wunder geschehen, wenn der Kopf nicht verletzt werden sollte. Und die Besinnung durfte er gerade jetzt um keinen Preis verlieren. Lieber wollte er im Bett bleiben."],[645.0,669.96,"Aber als er wieder nach gleicher Mühe aufseufzend, so dalag wie früher und wieder seine Beinchen womöglich noch ärger gegeneinander kämpfen sah und keine Möglichkeit fand, in diese Willkür Ruhe und Ordnung zu bringen, sagte er sich wieder, dass er unmöglich im Bett bleiben könne und dass es das Vernünftigste sei, alles zu opfern, wenn auch nur die kleinste Hoffnung bestünde, sich dadurch vom Bett zu befreien."],[670.04,714.36,"Gleichzeitig aber vergaß er nicht, sich zwischendurch daran zu erinnern, dass viel besser als verzweifelte Entschlüsse ruhige und ruhigste Überlegung sei. In solchen Augenblicken richtete er die Augen möglichst scharf auf das Fenster. Aber leider war aus dem Anblick des Morgennebels, der sogar die andere Seite der engen Straße verhüllte, wenig Zuversicht und Munterkeit zu holen. Schon 7:00 sagte er sich beim neuerlichen Schlagen des Weckers schon 7:00 und noch immer ein solcher Nebel, und ein Weilchen lang lag er ruhig, mit schwachem Atem, als erwarte er vielleicht von der völligen Stille die Wiederkehr der wirklichen und selbstverständlichen Verhältnisse."],[714.56,744.56,"Dann aber sagte er sich Ehe es 1/4 acht schlägt, muß ich unbedingt das Bett vollständig verlassen haben. Im übrigen wird auch bis dahin jemand aus dem Geschäft kommen, um nach mir zu fragen, denn das Geschäft wird vor 7:00 geöffnet. Und er machte sich nun daran, den Körper in seiner ganzen Länge vollständig gleichmäßig aus dem Bett hinauszuschaukeln. Wenn er sich auf diese Weise aus dem Bett fallen ließ, blieb der Kopf, den er beim Fall scharf heben wollte, voraussichtlich unverletzt."],[744.64,769.68,"Der Rücken schien hart zu sein. Dem würde wohl bei dem Fall auf den Teppich nichts geschehen. Das größte Bedenken machte ihm die Rücksicht auf den lauten Krach, den es geben müßte und der wahrscheinlich hinter allen Türen, wenn nicht schrecken, so doch Besorgnisse erregen würde. Das mußte aber gewagt werden, als Gregor schon zur Hälfte aus dem Bette ragte. Die neue Methode war mehr ein Spiel als eine Anstrengung."],[769.76,799.92,"Er brauchte immer nur ruckweise zu schaukeln. Fiel ihm ein, wie einfach alles wäre, wenn man ihm zu Hilfe käme. Zwei starke Leute. Er dachte an seinen Vater und das Dienstmädchen hätten vollständig genügt. Sie hätten ihre Arme nur unter seinen gewölbten Rücken schieben, ihn so aus dem Bett schälen, sich mit der Last nieder beugen und dann bloß vorsichtig dulden müssen, dass er den Überschwung auf dem Fußboden vollzog, wo dann die Beinchen hoffentlich einen Sinn bekommen würden."],[800.0,825.0,"Nun, ganz abgesehen davon, dass die Türen versperrt waren, hätte er wirklich um Hilfe rufen sollen. Trotz aller Not konnte er bei diesem Gedanken ein Lächeln nicht unterdrücken. Schon war er so weit, dass er bei stärkerem Schaukeln kaum das Gleichgewicht noch erhielt. Und sehr bald mußte er sich nun endgültig entscheiden. Denn es war in fünf Minuten 1/4 acht, als es an der Wohnungstür läutete."],[825.08,852.92,"Das ist jemand aus dem Geschäft, sagte er sich und erstarrte fast, während seine Beinchen nur desto eiliger tanzten. Einen Augenblick blieb alles still. Sie öffnen nicht, sagte sich Gregor, befangen in irgendeiner unsinnigen Hoffnung. Aber dann ging natürlich, wie immer das Dienstmädchen festen Schrittes zur Tür und öffnete. Gregor brauchte nur das erste Grußwort des Besuchers zu hören und wusste schon, wer es war."],[853.0,880.84,"Der Prokurist selbst. Warum war nur Gregor dazu verurteilt, bei einer Firma zu dienen, wo man bei der kleinsten Versäumnis gleich den größten Verdacht faßte? Waren denn alle Angestellten samt und sonders Lumpen? Gab es denn unter ihnen keinen treuen, ergebenen Menschen, der, wenn er auch nur ein paar Morgenstunden für das Geschäft nicht ausgenutzt hatte, vor Gewissensbissen närrisch wurde und geradezu nicht imstande war, das Bett zu verlassen."],[880.92,907.92,"Genügte es wirklich nicht, einen Lehrjungen nachfragen zu lassen, wenn überhaupt diese Fragerei nötig war? Mußte da der Prokurist selbst kommen und mußte dadurch der ganzen unschuldigen Familie gezeigt werden, dass die Untersuchung dieser verdächtigen Angelegenheit nur dem Verstand des Prokuristen anvertraut werden konnte? Und mehr infolge der Erregung, in welche Gregor durch diese Überlegungen versetzt wurde, als infolge eines richtigen Entschlusses."],[908.0,934.76,"Schwang er sich mit aller Macht aus dem Bett. Es gab einen lauten Schlag, aber ein eigentlicher Krach war es nicht. Ein wenig wurde der Fall durch den Teppich abgeschwächt. Auch war der Rücken elastischer, als Gregor gedacht hatte. Daher kam der nicht gar so auffallende dumpfe Klang. Nur den Kopf hatte er nicht vorsichtig genug gehalten und ihn angeschlagen. Er drehte ihn und rieb ihn an dem Teppich vor Ärger und Schmerz."],[934.84,965.44,"Da drin ist etwas gefallen, sagte der Prokurist im Nebenzimmer. Links. Gregor suchte sich vorzustellen, ob nicht auch einmal dem Prokuristen etwas Ähnliches passieren könnte wie heute ihm. Die Möglichkeit dessen mußte man doch eigentlich zugeben. Aber wie? Zur rohen Antwort auf diese Frage machte jetzt der Prokurist im Nebenzimmer ein paar bestimmte Schritte und ließ seine Lackstiefel knarren. Aus dem Nebenzimmer rechts flüsterte die Schwester, um Gregor zu verständigen."],[965.52,988.88,"Gregor, der Prokurist, ist da. Ich weiß, sagte Gregor vor sich hin, aber so laut, dass es die Schwester hätte hören können, wagte er die Stimme nicht zu erheben. Gregor, sagte nun der Vater aus dem Nebenzimmer links. Der Herr Prokurist ist gekommen und erkundigt sich, warum du nicht mit dem Frühzug weggefahren bist. Wir wissen nicht, was wir ihm sagen sollen."],[988.96,1010.48,"Übrigens will er auch mit dir persönlich sprechen. Also bitte, macht die Tür auf. Er wird die Unordnung im Zimmer zu entschuldigen, schon die Güte haben. Guten Morgen, Herr Samsa! Rief der Prokurist freundlich dazwischen. Ihm ist nicht wohl! Sagte die Mutter zum Prokuristen, während der Vater noch an der Tür redete. Ihm ist nicht wohl. Glauben Sie mir, Herr Prokurist."],[1010.56,1035.24,"Wie würde denn Gregor sonst einen Zug versäumen? Der Junge hat ja nichts im Kopf als das Geschäft. Ich ärgere mich schon fast, dass er abends niemals ausgeht. Jetzt war er doch acht Tage in der Stadt. Aber jeden Abend war er zu Hause. Da sitzt er bei uns am Tisch und liest still die Zeitung oder studiert Fahrpläne. Es ist schon eine Zerstreuung für ihn, wenn er sich mit Laubsäge Arbeiten beschäftigt."],[1035.32,1060.44,"Da hat er zum Beispiel im Laufe von zwei, drei Abenden einen kleinen Rahmen geschnitzt. Sie werden staunen, wie hübsch er ist. Er hängt drin im Zimmer. Sie werden ihn gleich sehen, bis Gregor aufmacht. Ich bin übrigens glücklich, dass Sie da sind, Herr Prokurist. Wir allein hätten Gregor nicht dazu gebracht, die Tür zu öffnen. Er ist so hartnäckig, und bestimmt ist ihm nicht wohl, trotzdem er es am Morgen geleugnet hat."],[1060.52,1087.56,"Ich komme gleich. Sagte Gregor langsam und bedächtig und rührte sich nicht, um kein Wort der Gespräche zu verlieren. Anders, gnädige Frau, kann ich es mir auch nicht erklären, sagte der Prokurist. Hoffentlich ist es nichts Ernstes. Wenn ich auch andererseits sagen muss, dass wir Geschäftsleute, wie man will, leider oder glücklicherweise ein leichtes Unwohlsein sehr oft aus geschäftlichen Rücksichten einfach überwinden müssen."],[1087.64,1111.6,"Also kann der Herr Prokurist schon zu dir hinein? Fragte der ungeduldige Vater und klopfte wiederum an die Tür. Nein, sagte Gregor im Nebenzimmer. Links trat eine peinliche Stille ein. Im Nebenzimmer rechts begann die Schwester zu schluchzen. Warum ging denn die Schwester nicht zu den anderen? Sie war wohl erst jetzt aus dem Bett aufgestanden und hatte noch gar nicht angefangen, sich anzuziehen."],[1111.68,1142.76,"Und warum weinte sie denn? Weil er nicht aufstand und den Prokuristen nicht hereinließ. Weil er in Gefahr war, den Posten zu verlieren. Und weil dann der Chef die Eltern mit den alten Forderungen wieder verfolgen würde? Das waren doch vorläufig wohl unnötige Sorgen. Noch war Gregor hier und dachte nicht im Geringsten daran, seine Familie zu verlassen. Augenblicklich lag er wohl da auf dem Teppich, und niemand, der seinen Zustand gekannt hätte, hätte im Ernst von ihm verlangt, dass er den Prokuristen hereinlasse."],[1142.84,1168.24,"Aber wegen dieser kleinen Unhöflichkeit, für die sicher später leicht eine passende Ausrede finden würde, konnte Gregor doch nicht gut sofort weggeschickt werden. Und Gregor schien es, dass es viel vernünftiger wäre, ihn jetzt in Ruhe zu lassen, statt ihn mit Weinen und Zureden zu stören. Aber es war eben die Ungewissheit, welche die anderen bedrängte und ihr Benehmen entschuldigte. Herr Samsa!"],[1168.32,1194.28,"Rief nun der Prokurist mit erhobener Stimme. Was ist denn los? Sie verbarrikadieren sich da in Ihrem Zimmer, antworten bloß mit Ja und Nein, machen Ihren Eltern schwere, unnötige Sorgen und versäumen dies nur nebenbei, erwähnt ihre geschäftliche Pflichten in einer eigentlich unerhörten Weise. Ich spreche hier im Namen Ihrer Eltern und Ihres Chefs und bitte Sie ganz ernsthaft um eine augenblickliche deutliche Erklärung."],[1194.36,1219.44,"Ich staune, ich staune. Ich glaubte, Sie als einen ruhigen, vernünftigen Menschen zu kennen, und nun scheinen Sie plötzlich anfangen zu wollen, mit sonderbaren Launen zu paradieren. Der Chef deutete mir zwar heute früh eine mögliche Erklärung für ihre Versäumnisse an, sie betraf das Ihnen seit kurzem anvertraute Inkasso, aber ich legte wahrhaftig fast mein Ehrenwort dafür ein, dass diese Erklärung nicht zutreffen könne."],[1219.52,1241.08,"Nun aber sehe ich hier Ihren unbegreiflichen Starrsinn und verliere ganz und gar jede Lust, mich auch nur im geringsten für sie einzusetzen, und ihre Stellung ist durchaus nicht die festeste. Ich hatte ursprünglich die Absicht, Ihnen das alles unter vier Augen zu sagen, aber da Sie mich hier nutzlos meine Zeit versäumen lassen, weiß ich nicht, warum es nicht auch Ihr Herren Eltern erfahren sollen."],[1241.16,1264.96,"Ihre Leistungen in der letzten Zeit waren also sehr unbefriedigend. Es ist zwar nicht die Jahreszeit, um besondere Geschäfte zu machen, das erkennen wir an, aber eine Jahreszeit, um keine Geschäfte zu machen, gibt es überhaupt nicht. Herr Samsa darf es nicht geben. Aber, Herr Prokurist! Rief Gregor außer sich und vergaß in der Aufregung alles andere. Ich mache ja sofort, augenblicklich auf."],[1265.04,1286.68,"Ein leichtes Unwohlsein, ein Schwindelanfall haben mich verhindert aufzustehen. Ich liege noch jetzt im Bett. Jetzt bin ich aber schon wieder ganz frisch. Eben steige ich aus dem Bett. Nur einen kleinen Augenblick Geduld. Es geht noch nicht so gut, wie ich dachte. Es ist mir aber schon wohl, wie das nur einen Menschen so überfallen kann. Noch gestern Abend war mir ganz gut."],[1286.84,1308.4,"Meine Eltern wissen es ja. Oder besser schon gestern Abend hatte ich eine kleine Vorahnung. Man hätte es mir ansehen müssen. Warum habe ich es nur im Geschäfte nicht gemeldet? Aber man denkt eben immer, dass man die Krankheit ohne zu Hause bleiben überstehen wird. Herr Prokurist, schonen Sie meine Eltern für alle. Die Vorwürfe, die Sie mir jetzt machen, ist ja kein Grund."],[1308.48,1328.96,"Man hat mir ja davon auch kein Wort gesagt. Sie haben vielleicht die letzten Aufträge, die ich geschickt habe, nicht gelesen. Übrigens noch mit dem 8:00 Zug fahre ich auf die Reise. Die paar Stunden Ruhe haben mich gekräftigt. Halten Sie sich nur nicht auf, Herr Prokurist. Ich bin gleich selbst im Geschäft. Und haben Sie die Güte, das zu sagen und mich dem Herrn Chef zu empfehlen?"],[1329.04,1355.68,"Und während Gregor dies alles hastig ausstieß und kaum wußte, was er sprach, hatte er sich leicht wohl infolge der im Bett bereits erlangten Übung dem Kasten genähert und versuchte nun an ihm sich aufzurichten. Er wollte tatsächlich die Tür aufmachen, tatsächlich sich sehen lassen und mit dem Prokuristen sprechen. Er war begierig zu erfahren, was die anderen, die jetzt so nach ihm verlangten, bei seinem Anblick sagen würden."],[1355.76,1379.4,"Würden sie erschrecken. Dann hatte Gregor keine Verantwortung mehr und konnte ruhig sein. Würden sie aber alles ruhig hinnehmen, dann hatte auch er keinen Grund, sich aufzuregen und konnte, wenn er sich beeilte, um 8:00 tatsächlich auf dem Bahnhof sein. Zuerst glitt er nun einige Male von dem glatten Kasten ab, aber endlich gab er sich einen letzten Schwung und stand aufrecht da."],[1379.48,1401.96,"Auf die Schmerzen im Unterleib achtete er gar nicht mehr, so sehr sie auch brannten. Nun ließ er sich gegen die Rückenlehne eines nahen Stuhles fallen, an deren Rändern er sich mit seinen Beinchen festhielt. Damit hatte er aber auch die Herrschaft über sich erlangt und verstummte, denn nun konnte er den Prokuristen anhören. Haben Sie auch nur ein Wort verstanden?"],[1402.04,1426.8,"Fragte der Prokurist die Eltern. Er macht sich doch wohl nicht einen Narren aus uns? Um Gottes willen! Rief die Mutter schon unter Weinen. Er ist vielleicht schwer krank, und wir quälen ihn. Grete! Grete! Schrie sie dann. Mutter! Rief die Schwester von der anderen Seite. Sie verständigten sich durch Gregors Zimmer. Du mußt augenblicklich zum Arzt. Gregor ist krank. Rasch um den Arzt!"],[1426.88,1450.52,"Hast du Gregor jetzt reden hören? Das war eine Tierstimme, sagte der Prokurist auffallend leise gegenüber dem Schreien der Mutter. Anna! Anna! Rief der Vater durch das Vorzimmer in die Küche und klatschte in die Hände. Sofort einen Schlosser holen! Und schon liefen die zwei Mädchen mit rauschenden Röcken durch das Vorzimmer. Wie hatte sich die Schwester denn so schnell angezogen?"],[1450.6,1474.56,"Und rissen die Wohnungstüre auf. Man hörte gar nicht die Türe zuschlagen. Sie hatten sie wohl offengelassen, wie es in Wohnungen zu sein pflegt, in denen ein großes Unglück geschehen ist. Gregor war aber viel ruhiger geworden. Man verstand zwar also seine Worte nicht mehr, trotzdem sie ihm genug klar klarer als früher vorgekommen waren, vielleicht infolge der Gewöhnung des Ohres."],[1474.64,1505.84,"Aber immerhin glaubte man nun schon daran, dass es mit ihm nicht ganz in Ordnung war, und war bereit, ihm zu helfen, die Zuversicht und Sicherheit mit welchen die ersten Anordnungen getroffen worden waren, taten ihm wohl. Er fühlte sich wieder einbezogen in den menschlichen Kreis und erhoffte von beiden vom Arzt und vom Schlosser, ohne sie eigentlich genau zu scheiden, großartige und überraschende Leistungen, um für die sich nähernden entscheidenden Besprechungen eine möglichst klare Stimme zu bekommen."],[1505.92,1538.32,"Hustete er ein wenig ab, allerdings bemüht, dies ganz gedämpft zu tun, da möglicherweise auch schon dieses Geräusch anders als menschlicher Husten klang, was er selbst zu entscheiden sich nicht mehr getraute. Im Nebenzimmer war es inzwischen ganz still geworden. Vielleicht saßen die Eltern mit dem Prokuristen beim Tisch und tuschelten. Vielleicht lehnten alle an der Türe und horchten. Gregor schob sich langsam mit dem Sessel zur Tür hin, ließ ihn dort los, warf sich gegen die Tür, hielt sich an ihr aufrecht."],[1538.4,1575.12,"Die Ballen seiner Beinchen hatten ein wenig Klebstoff und ruhte sich dort einen Augenblick lang von der Anstrengung aus. Dann aber machte er sich daran, mit dem Mund den Schlüssel im Schloss umzudrehen. Es schien leider, dass er keine eigentlichen Zähne hatte. Womit sollte er gleich den Schlüssel fassen? Aber dafür waren die Kiefer freilich sehr stark. Mit ihrer Hilfe brachte er auch wirklich den Schlüssel in Bewegung und achtete nicht darauf, dass er sich zweifellos irgendeinen Schaden zufügte, denn eine braune Flüssigkeit kam ihm aus dem Mund, floss über den Schlüssel und tropfte auf den Boden."],[1575.2,1605.04,"Hören Sie nur. Sagte der Prokurist im Nebenzimmer. Er dreht den Schlüssel um. Das war für Gregor eine große Aufmunterung. Aber alle hätten ihm zurufen sollen, auch der Vater und die Mutter, Frisch Gregor, hätten sie rufen sollen. Immer nur heran, fest an das Schloss heran. Und in der Vorstellung, dass alle seine Bemühungen mit Spannung verfolgten, verbiß er sich mit allem, was er an Kraft aufbringen konnte, besinnungslos in den Schlüssel."],[1605.12,1629.96,"Je nach dem Fortschreiten der Drehung des Schlüssels um tanzte er das Schloss, hielt sich jetzt nur noch mit dem Munde aufrecht, und je nach Bedarf hing er sich an den Schlüssel oder drückte ihn dann wieder nieder mit der ganzen Last seines Körpers. Der hellere Klang des endlich zurück schnappenden Schlosses erweckte Gregor förmlich. Aufatmend sagte er sich Ich habe also den Schlosser nicht gebraucht."],[1630.04,1652.76,"Und legte den Kopf auf die Klinke, um die Türe gänzlich zu öffnen. Da er die Türe auf diese Weise öffnen mußte, war sie eigentlich schon recht weit geöffnet und er selbst noch nicht zu sehen. Er mußte sich erst langsam um den einen Türflügel herumdrehen, und zwar sehr vorsichtig, wenn er nicht gerade vor dem Eintritt ins Zimmer plump auf den Rücken fallen wollte."],[1652.84,1679.76,"Er war noch mit jener schwierigen Bewegung beschäftigt und hatte nicht Zeit, auf anderes zu achten. Da hörte er schon den Prokuristen ein lautes Ohhh ausstoßen. Es klang, wie wenn der Wind saust. Und nun sah er ihn auch, wie er, der der nächste an der Türe war, die Hand gegen den offenen Mund drückte und langsam zurückwich, als vertreibe ihn eine unsichtbare, gleichmäßig fortwirkende Kraft."],[1679.84,1717.64,"Die Mutter. Sie stand hier trotz der Anwesenheit des Prokuristen mit von der Nacht her noch aufgelösten, hoch sich sträubenden Haaren, sah zuerst mit gefalteten Händen den Vater an, ging dann zwei Schritte zu Gregor hin und fiel inmitten ihrer rings um sie herum sich ausbreitenden Röcke nieder, das Gesicht ganz unauffindbar zu ihrer Brust gesenkt. Der Vater ballte mit feindseligen Ausdruck die Faust, als wolle er Gregor in sein Zimmer zurückstoßen, sah sich dann unsicher im Wohnzimmer um, beschattete dann mit den Händen die Augen und weinte, dass sich seine mächtige Brust schüttelte."],[1717.8,1742.88,"Gregor trat nun gar nicht in das Zimmer, sondern lehnte sich von innen an den fest geregelten Türflügel, so dass sein Leib nur zur Hälfte und darüber der seitlich geneigte Kopf zu sehen war, mit dem er zu den anderen hinüber lugte. Es war inzwischen viel heller geworden. Klar stand auf der anderen Straßenseite ein Ausschnitt des gegenüberliegenden endlosen, grau schwarzen Hauses."],[1742.96,1772.0,"Es war ein Krankenhaus mit seinen hart die Front durchbrechenden regelmäßigen Fenstern. Der Regen fiel noch nieder, aber nur mit großen, einzeln sichtbaren und förmlich auch einzeln weise auf die Erde hinuntergeworfenen Tropfen. Das Frühstücksgeschirr stand in ueberreicher Zahl auf dem Tisch, denn für den Vater war das Frühstück die wichtigste Mahlzeit des Tages, die er bei der Lektüre verschiedener Zeitungen stundenlang hinzog."],[1772.08,1797.12,"Gerade an der gegenüberliegenden Wand hing eine Photographie Gregors aus seiner Militärzeit, die ihn als Leutnant darstellte, wie er die Hand am Degen sorglos lächelnd Respekt für seine Haltung und Uniform verlangte. Die Tür zum Vorzimmer war geöffnet, und man sah, da auch die Wohnungstür offen war, auf den Vorplatz der Wohnung hinaus und auf den Beginn der abwärts führenden Treppe."],[1797.2,1821.04,"Nun! Sagte Gregor und war sich dessen wohl bewußt, dass er der einzige war, der die Ruhe bewahrt hatte. Ich werde mich gleich anziehen, die Kollektion zusammenpacken und wegfahren. Wollt Ihr? Wollt Ihr mich wegfahren lassen? Nun, Herr Prokurist, Sie sehen, ich bin nicht starrköpfig, und ich arbeite gern. Das Reisen ist beschwerlich, aber ich könnte ohne das Reisen nicht leben."],[1821.12,1847.28,"Wohin gehen Sie denn, Herr Prokurist? Ins Geschäft. Ja. Werden Sie alles wahrheitsgetreu berichten? Man kann im Augenblick unfähig sein zu arbeiten, aber dann ist gerade der richtige Zeitpunkt, sich an die früheren Leistungen zu erinnern und zu bedenken, dass man später nach Beseitigung des Hindernisses, gewiss desto fleißiger und gesammelter arbeiten wird. Ich bin ja dem Herrn Chef so sehr verpflichtet, das wissen Sie doch recht gut."],[1847.36,1872.28,"Andererseits habe ich die Sorge um meine Eltern und die Schwester. Ich bin in der Klemme. Ich werde mich aber auch wieder herausarbeiten. Machen Sie es mir aber nicht schwieriger, als es schon ist. Halten Sie im Geschäft meine Partei. Man liebt den Reisenden nicht. Ich weiß. Man denkt, er verdient ein Heidengeld und führt dabei ein schönes Leben. Man hat eben keine besondere Veranlassung, dieses Vorurteil besser zu durchdenken."],[1872.36,1916.96,"Sie aber, Herr Prokurist, Sie haben einen besseren Überblick über die Verhältnisse als das sonstige Personal. Ja, sogar ganz im Vertrauen gesagt einen besseren Überblick als der Herr Chef selbst, der in seiner Eigenschaft als Unternehmer sich in seinem Urteil leicht zuungunsten eines Angestellten beirren läßt. Sie wissen auch sehr wohl, dass der Reisende, der fast das ganze Jahr außerhalb des Geschäfts ist, so leicht ein Opfer von Klatschereien, Zufälligkeiten und grundlosen Beschwerden werden kann, gegen die sich zu wehren ihn ganz unmöglich ist, da er von ihnen meistens gar nichts erfährt, und nur dann, wenn er erschöpft eine Reise beendet hat, zu Hause die schlimmen, auf ihre Ursachen hin nicht mehr zu durchschauenden Folgen am eigenen Leibe zu spüren"],[1916.96,1944.96,"bekommt. Herr Prokurist. Gehen Sie nicht weg, ohne mir ein Wort gesagt zu haben, das mir zeigt, dass Sie mir wenigstens zu einem kleinen Teil recht geben. Aber der Prokurist hatte sich schon bei den ersten Worten Gregors abgewendet, und nur über die zuckende Schulter hinweg sah er mit aufgeworfenen Lippen nach Gregor zurück. Und während Gregors Rede stand er keinen Augenblick still, sondern verzog sich, ohne Gregor aus den Augen zu lassen, gegen die Tür."],[1945.04,1970.96,"Aber ganz allmählich, als bestehe ein geheimes Verbot, das Zimmer zu verlassen. Schon war er im Vorzimmer, und nach der plötzlichen Bewegung, mit der er zum letzten Mal den Fuß aus dem Wohnzimmer zog, hätte man glauben können, er habe sich soeben die Sohle verbrannt. Im Vorzimmer aber streckte er die rechte Hand weit von sich zur Treppe hin, als warte dort auf ihn eine geradezu überirdische Erlösung."],[1971.04,1998.6,"Gregor sah ein, dass er den Prokuristen in dieser Stimmung auf keinen Fall weggehen lassen dürfe, wenn dadurch seine Stellung im Geschäft nicht aufs äußerste gefährdet werden sollte. Die Eltern verstanden das alles nicht so gut. Sie hatten sich in den langen Jahren die Überzeugung gebildet, dass Gregor in diesem Geschäft für sein Leben versorgt war, und hatten außerdem jetzt mit den augenblicklichen Sorgen so viel zu tun, dass ihnen jede Voraussicht abhanden gekommen war."],[1998.68,2030.16,"Aber Gregor hatte diese Voraussicht. Der Prokurist mußte gehalten, beruhigt, überzeugt und schließlich gewonnen werden. Die Zukunft Gregors und seiner Familie hing doch davon ab. Wäre doch die Schwester hier gewesen. Sie war klug. Sie hatte schon geweint, als Gregor noch ruhig auf dem Rücken lag. Und gewiss hätte der Prokurist dieser Damen Freund sich von ihr lenken lassen. Sie hätte die Wohnungstür zugemacht und ihm im Vorzimmer den Schrecken ausgeredet."],[2030.24,2065.32,"Aber die Schwester war eben nicht da. Gregor selbst mußte handeln, und ohne daran zu denken, dass er seine gegenwärtigen Fähigkeiten, sich zu bewegen, noch gar nicht kannte, ohne auch daran zu denken, dass seine Rede möglicher, ja wahrscheinlicher Weise wieder nicht verstanden worden war, verließ er den Türflügel, schob sich durch die Öffnung, wollte zum Prokuristen hingehen, der sich schon am Geländer des Vorplatzes lächerlicherweise mit beiden Händen festhielt, fiel aber sofort nach einem Halt suchend, mit einem kleinen Schrei auf seine vielen Beinchen nieder."],[2065.4,2108.2,"Kaum war das geschehen, fühlte er zum Ersten Mal an diesem Morgen ein körperliches Wohlbehagen. Die Beinchen hatten festen Boden unter sich. Sie gehorchten vollkommen, wie er zu seiner Freude merkte, strebten sogar danach, ihn vorzutragen, wohin er wollte, und schon glaubte er, die endgültige Besserung alles Leidens stehe unmittelbar bevor. Aber im gleichen Augenblick, als er da Schaukelnde vor verhaltener Bewegung, gar nicht weit von seiner Mutter entfernt, ihr gerade gegenüber auf dem Boden lag, sprang diese, die doch so ganz in sich versunken schien, mit einem Male in die Höhe, die Arme weit ausgestreckt, die Finger gespreizt, rief Hilfe!"],[2108.4,2135.68,"Um Gottes willen! Hilfe! Hielt den Kopf geneigt, als wolle sie Gregor besser sehen, lief aber im Widerspruch dazu sinnlos zurück. Hatte vergessen, dass hinter ihr der gedeckte Tisch stand, setzte sich, als sie bei ihm angekommen war, wie in Zerstreutheit eilig auf ihn und schien gar nicht zu merken, dass neben ihr aus der umgeworfen en großen Kanne der Kaffee in vollem Strome auf den Teppich sich ergoß."],[2135.88,2163.08,"Mutter! Mutter! Sagte Gregor leise und sah zu ihr hinauf. Der Prokurist war ihm für einen Augenblick ganz aus dem Sinn gekommen. Dagegen konnte er sich nicht versagen, im Anblick des fließenden Kaffees mehrmals mit den Kiefern ins Leere zu schnappen. Darüber schrie die Mutter neuerdings auf, flüchtete vom Tisch und fiel dem ihr entgegeneilenden Vater in die Arme. Aber Gregor hatte jetzt keine Zeit für seine Eltern."],[2163.16,2192.04,"Der Prokurist war schon auf der Treppe. Das Kinn auf dem Geländer sah er noch zum letzten Male zurück. Gregor nahm einen Anlauf, um ihn möglichst sicher einzuholen. Der Prokurist mußte etwas ahnen, denn er machte einen Sprung über mehrere Stufen und verschwand. Ho aber, schrie er noch, es klang durchs ganze Treppenhaus. Leider schien nun auch diese Flucht des Prokuristen den Vater, der bisher verhältnismäßig gefasst gewesen war, völlig zu verwirren."],[2192.12,2215.32,"Denn statt selbst dem Prokuristen nachzulaufen oder wenigstens Gregor in der Verfolgung nicht zu hindern, packte er mit der Rechten den Stock des Prokuristen, den dieser mit Hut und Überzieher auf einem Sessel zurückgelassen hatte, holte mit der Linken eine große Zeitung vom Tisch und machte sich unter Füße stampfen daran, Gregor durch Schwenken des Stockes und der Zeitung in sein Zimmer zurück zu treiben."],[2215.4,2245.64,"Kein Bitten Gregors half, kein Bitten wurde auch verstanden. Er mochte den Kopf noch so demütig drehen. Der Vater stampfte nur stärker mit den Füßen. Drüben hatte die Mutter trotz des kühlen Wetters ein Fenster aufgerissen, und hinaus gelehnt, drückte sie ihr Gesicht weit außerhalb des Fensters in ihre Hände. Zwischen Gasse und Treppenhaus entstand eine starke Zugluft. Die Fenster. Vorhänge flogen auf die Zeitungen, auf dem Tische rauschten, einzelne Blätter wehten über den Boden hin."],[2245.72,2274.36,"Unerbittlich drängte der Vater und stieß Zischlaute aus wie ein Wilder. Nun hatte aber Gregor noch gar keine Übung im Rückwärtsgehen. Es ging wirklich sehr langsam. Wenn sich Gregor nur hätte umdrehen dürfen, er wäre gleich in seinem Zimmer gewesen. Aber er fürchtete sich, den Vater durch die zeitraubende Umdrehung ungeduldig zu machen, und jeden Augenblick drohte ihm doch von dem Stock in des Vaters Hand der tödliche Schlag auf den Rücken oder auf den Kopf."],[2274.44,2304.52,"Endlich aber blieb Gregor doch nichts anderes übrig, denn er merkte mit Entsetzen, dass er im Rückwärtsgehen nicht einmal die Richtung einzuhalten verstand. Und so begann er unter unaufhörlichen, ängstlichen Seitenblicken nach dem Vater sich nach Möglichkeit rasch, in Wirklichkeit aber doch nur sehr langsam umzudrehen. Vielleicht merkte der Vater seinen guten Willen, denn er störte ihn hierbei nicht, sondern dirigierte sogar hie und da die Drehbewegung von der Ferne mit der Spitze seines Stockes."],[2304.6,2329.56,"Wenn nur nicht dieses unerträgliche Zischen des Vaters gewesen wäre! Gregor verlor darüber ganz den Kopf. Er war schon fast ganz umgedreht, als er sich immer auf dieses Zischen Horchende sogar irrte und sich wieder ein Stück zurück drehte. Als er aber endlich glücklich mit dem Kopf vor der Türöffnung war, zeigte es sich, dass sein Körper zu breit war, um ohne Weiteres durchzukommen."],[2329.64,2355.48,"Dem Vater fiel es natürlich in seiner gegenwärtigen Verfassung auch nicht entfernt ein, etwa den anderen Türflügel zu öffnen, um für Gregor einen genügenden Durchgang zu schaffen. Seine fixe Idee war bloß, dass Gregor so rasch als möglich in sein Zimmer müsse. Niemals hätte er auch die umständlichen Vorbereitungen gestattet, die Gregor brauchte, um sich aufzurichten und vielleicht auf diese Weise durch die Tür zu kommen."],[2355.56,2382.0,"Vielmehr trieb er, als gäbe es kein Hindernis. Gregor Jetzt unter besonderem Lärm vorwärts. Es klang schon hinter Gregor gar nicht mehr wie die Stimme bloß eines einzigen Vaters. Nun gab es wirklich keinen Spaß mehr. Und Gregor drängte sich, geschehe, was wolle, in die Tür. Die eine Seite seines Körpers hob sich. Er lag schief in der Türöffnung. Seine eine Flanke war ganz wund gerieben."],[2382.08,2406.64,"An der weißen Tür blieben häßliche Flecken. Bald steckte er fest und hätte sich allein nicht mehr rühren können. Die Beinchen auf der einen Seite hingen zitternd oben in der Luft, die auf der anderen waren schmerzhaft zu Boden gedrückt. Da gab ihm der Vater von hinten einen jetzt wahrhaftig erlösenden, starken Stoß, und er flog heftig blutend weit in sein Zimmer hinein."],[2406.72,2411.48,"Die Tür wurde noch mit dem Stock zugeschlagen. Dann war es endlich still."],[2411.56,2439.96,"Erst in der Abenddämmerung erwachte Gregor aus seinem schweren, ohnmachtsähnlichen Schlaf. Er wäre gewiss nicht viel später auch ohne Störung erwacht, denn er fühlte sich genügend ausgeruht und ausgeschlafen. Doch schien es ihm, als hätte ihn ein flüchtiger Schritt und ein vorsichtiges Schließen, der zum Vorzimmer führenden Tür geweckt. Der Schein der elektrischen Straßenlampen lag bleich hier und da auf der Zimmerdecke und auf den höheren Teilen der Möbel."],[2440.04,2467.96,"Aber unten bei Gregor war es finster. Langsam schob er sich, noch ungeschickt mit seinen Schülern tastend, die er erst jetzt schätzen lernte, zur Türe hin, um nachzusehen, was dort geschehen war. Seine linke Seite schien eine einzige, lange, unangenehm spannende Narbe und er mußte auf seinen zwei Beinen Reihen regelrecht hinken. Ein Beinchen war übrigens im Laufe der vormittägigen Vorfälle schwer verletzt worden."],[2468.04,2491.84,"Es war fast ein Wunder, dass nur eines verletzt worden war und schleppte leblos nach. Erst bei der Tür merkte er, was ihn dorthin eigentlich gelockt hatte. Es war der Geruch von etwas Essbarem gewesen, denn dort stand ein Napf mit süßer Milch gefüllt, in der kleine Schnitten von Weißbrot schwammen. Fast hätte er vor Freude gelacht, denn er hatte noch größeren Hunger als am Morgen."],[2492.04,2517.88,"Und gleich tauchte er seinem Kopf fast bis über die Augen in die Milch hinein. Aber bald zog er ihn enttäuscht wieder zurück. Nicht nur, dass ihm das Essen wegen seiner heiklen linken Seite Schwierigkeiten machte, und er konnte nur essen, wenn der ganze Körper schnaufend mitarbeitete, so schmeckte ihm überdies die Milch, die sonst sein Lieblingsgetränk war und die ihm gewiss die Schwester deshalb hereingestellt hatte, gar nicht."],[2517.96,2550.68,"Ja, er wandte sich fast mit Widerwillen von dem Napf ab und kroch in die Zimmermitte zurück. Im Wohnzimmer war, wie Gregor durch die Tür spalte, sah das Gas angezündet. Aber während sonst zu dieser Tageszeit der Vater seine nachmittags erscheinende Zeitung der Mutter und manchmal auch der Schwester mit erhobener Stimme vorzulegen pflegte, hörte man jetzt keinen Laut. Nun, vielleicht war dieses Vorlesen, von dem ihm die Schwester immer erzählte und schrieb, in der letzten Zeit überhaupt aus der Übung gekommen."],[2550.76,2585.28,"Aber auch ringsherum war es so still, trotzdem doch gewiss die Wohnung nicht leer war. Was für ein stilles Leben die Familie doch führte, sagte sich Gregor und fühlte, während er starr vor sich ins Dunkle sah, einen großen Stolz darüber, dass er seinen Eltern und seiner Schwester ein solches Leben in einer so schönen Wohnung hatte verschaffen können. Wie aber, wenn jetzt alle Ruhe, aller Wohlstand, alle Zufriedenheit ein Ende mit Schrecken nehmen sollte, um sich nicht in solche Gedanken zu verlieren?"],[2585.52,2615.8,"Setzte sich Gregor lieber in Bewegung und kroch im Zimmer auf und ab. Einmal, während des langen Abends, wurde die eine Seitentüre und einmal die andere bis zu einer kleinen Spalte geöffnet und rasch wieder geschlossen. Jemand hatte wohl das Bedürfnis hereinzukommen, aber auch wieder zu viele Bedenken. Gregor machte nun unmittelbar bei der Wohnzimmertür Halt, entschlossen, den zögernden Besucher doch irgendwie herein zu bringen Oder doch wenigstens zu erfahren, wer es sei."],[2615.88,2646.76,"Aber nun wurde die Tür nicht mehr geöffnet und Gregor wartete vergebens. Früh, als die Türen versperrt waren, hatten alle zu ihm hereinkommen wollen, jetzt, da er die eine Tür geöffnet hatte und die anderen offenbar während des Tages geöffnet worden waren, kam keiner mehr, und die Schlüssel steckten nun auch von außen. Spät erst in der Nacht wurde das Licht im Wohnzimmer ausgelöscht und nun war leicht festzustellen, dass die Eltern und die Schwester so lange wach geblieben waren."],[2646.84,2673.16,"Denn wie man genau hören konnte, entfernten sich jetzt alle drei auf den Fußspitzen. Nun kam gewiss bis zum Morgen niemand mehr zu Gregor herein. Er hatte also eine lange Zeit, um ungestört zu überlegen, wie er sein Leben jetzt neu ordnen sollte. Aber das hohe freie Zimmer, in dem er gezwungen war, flach auf dem Boden zu liegen, ängstigte ihn, ohne dass er die Ursache herausfinden konnte."],[2673.24,2699.32,"Denn es war ja sein seit fünf Jahren von ihm bewohntes Zimmer und mit einer halb unbewußten Wendung und nicht ohne eine leichte Scham eilte er unter das Kanapee, wo er sich trotzdem seinen Rücken ein wenig gedrückt wurde, und trotzdem er den Kopf nicht mehr erheben konnte, gleich sehr behaglich fühlte und nur bedauerte, dass sein Körper zu breit war, um vollständig unter dem Kanapee untergebracht zu werden."],[2699.4,2726.24,"Dort blieb er die ganze Nacht, die er zum Teil im Halbschlaf aus dem in der Hunger immer wieder aufschreckte, verbrachte, zum Teil aber in Sorgen und undeutlichen Hoffnungen, die aber alle zu dem Schlusse führten, dass er sich vorläufig ruhig verhalten und durch Geduld und größte Rücksichtnahme der Familie die Unannehmlichkeiten erträglich machen müsse, die er ihr in seinem gegenwärtigen Zustand nun einmal zu verursachen gezwungen war."],[2726.32,2750.76,"Schon am frühen Morgen, es war fast noch Nacht, hatte Gregor Gelegenheit, die Kraft seiner eben gefaßten Entschlüsse zu prüfen. Denn vom Vorzimmer her öffnete die Schwester, fast völlig angezogen, die Tür und sah mit Spannung herein. Sie fand ihn nicht gleich, aber als sie ihn unter dem Kanapee bemerkte. Gott, er mußte doch irgendwo sein! Er hatte doch nicht wegfliegen können."],[2750.84,2787.52,"Erschrak sie so sehr, dass sie, ohne sich beherrschen zu können, die Tür von außen wieder zuschlug. Aber als bereue sie ihr Benehmen, öffnete sie die Tür sofort wieder und trat, als sei sie bei einem schwerkranken oder gar bei einem Fremden auf den Fußspitzen herein. Gregor hatte den Kopf bis knapp zum Rande des Kanapee vorgeschoben und beobachtete sie, ob sie wohl bemerken würde, dass er die Milch stehen gelassen hatte, und zwar keineswegs aus Mangel an Hunger, und ob sie eine andere Speise hereinbringen würde, die ihm besser entsprach, täte sie es nicht von selbst."],[2787.52,2815.72,"Er wollte lieber verhungern, als sie darauf aufmerksam machen. Trotzdem es ihn eigentlich ungeheuer drängte, unterm Kanapee vorzuschießen, sich der Schwester zu Füßen zu werfen und sie um irgendetwas Gutes zum Essen zu bitten. Aber die Schwester bemerkte sofort mit Verwunderung den noch vollen Napf, aus dem nur ein wenig Milch ringsherum verschüttet war. Sie hob ihn gleich auf, zwar nicht mit den bloßen Händen, sondern mit einem Fetzen, und trug ihn hinaus."],[2815.8,2856.16,"Gregor war äußerst neugierig, was sie zum Ersatz bringen würde, und er machte sich die verschiedensten Gedanken darüber. Niemals aber hätte er erraten können, was die Schwester in ihrer Güte wirklich tat. Sie brachte ihm, um seinen Geschmack zu prüfen, eine ganze Auswahl, alles auf einer alten Zeitung ausgebreitet. Da war altes, halb verfaultes Gemüse, Knochen vom Nachtmahl her, die von festgewordener weißer Soße umgeben waren, ein paar Rosinen und Mandeln, ein Käse, den Gregor vor zwei Tagen für ungenießbar erklärt hatte, ein trockenes Brot, ein mit Butter beschmiertes und gesalzen es Brot."],[2856.24,2881.96,"Außerdem stellte sie zudem allen noch den wahrscheinlich ein für allemal für Gregor bestimmten Napf, in den sie Wasser gegossen hatte, und aus Zartgefühl. Da sie wußte, dass Gregor vor ihr nicht essen würde, entfernte sich eiligst und drehte sogar den Schlüssel um, damit nur Gregor merken könne, dass er es so behaglich machen dürfe, wie er wolle. Gregors Beinchen schwirrten, als es jetzt zum Essen ging."],[2882.04,2911.08,"Seine Wunden mußten übrigens auch schon vollständig geheilt sein. Er fühlte keine Behinderung mehr, erstaunte darüber und dachte daran, wie er vor mehr als einem Monat sich mit dem Messer ganz wenig in den Finger geschnitten und wie ihm diese Wunde noch vorgestern genug wehgetan hatte. Sollte ich jetzt weniger Feingefühl haben? Dachte er und saugte schon gierig an dem Käse zu, dem es ihn vor allen anderen Speisen sofort und nachdrücklich gezogen hatte."],[2911.16,2940.04,"Rasch hintereinander und mit vor Befriedigung tränenden Augen verzehrte er den Käse, das Gemüse und die Soße, die frischen Speisen dagegen schmeckten ihm nicht. Er konnte nicht einmal ihren Geruch vertragen und schleppte sogar die Sachen, die er essen wollte, ein Stückchen weiter weg. Er war schon längst mit allem fertig und lag nun faul auf der gleichen Stelle. Als die Schwester zum Zeichen, dass er sich zurückziehen solle, langsam den Schlüssel umdrehte."],[2940.12,2963.2,"Das schreckte ihn sofort auf, trotzdem er schon fast schlummerte und er eilte wieder unter das Kanapee. Aber es kostete ihn große Selbstüberwindung, auch nur die kurze Zeit, während welcher die Schwester im Zimmer war, unter dem Kanapee zu bleiben. Denn von dem reichlichen Essen hatte sich sein Leib ein wenig gerundet, und er konnte dort in der Enge kaum atmen."],[2963.28,2995.16,"Unter kleinen Erstickungsanfällen sah er mit etwas hervor gequollenen Augen zu, wie die nichtsahnende Schwester mit einem Besen nicht nur die Überbleibsel zusammenkehrte, sondern selbst die von Gregor gar nicht berührten Speisen, als seien also auch diese nicht mehr zu gebrauchen. Und wie sie alles hastig in einen Kübel schüttete, den sie mit einem Holzdeckel schloss, worauf sie alles hinaustrug. Kaum hatte sie sich umgedreht, zog sich schon Gregor unter dem Kanapee hervor und streckte und blähte sich."],[2995.24,3023.08,"Auf diese Weise bekam nun Gregor täglich sein Essen. Einmal am Morgen, wenn die Eltern und das Dienstmädchen noch schliefen. Das zweite Mal nach dem allgemeinen Mittagessen, denn dann schliefen die Eltern gleichfalls noch ein Weilchen, und das Dienstmädchen wurde von der Schwester mit irgendeiner Besorgung weggeschickt. Gewiss wollten auch sie nicht, dass Gregor verhungere. Aber vielleicht hätten sie es nicht ertragen können, von seinem Essen mehr als durch Hörensagen zu erfahren."],[3023.16,3046.48,"Vielleicht wollte die Schwester Ihnen auch eine möglicherweise nur kleine Trauer ersparen, denn tatsächlich litten sie ja gerade genug. Mit welchen Ausreden man an jenem ersten Vormittag den Arzt und den Schlosser wieder aus der Wohnung geschafft hatte, konnte Gregor gar nicht erfahren, denn da er nicht verstanden wurde, dachte niemand daran, auch die Schwester nicht, dass er die anderen verstehen könne."],[3046.56,3072.24,"Und so mußte er sich, wenn die Schwester in seinem Zimmer war, damit begnügen, nur hier und da ihre Seufzer und Anrufe der Heiligen zu hören. Erst später, als sie sich ein wenig an alles gewöhnt hatte, von vollständiger Gewöhnung, konnte natürlich niemals die Rede sein, erhaschte Gregor manchmal eine Bemerkung, die freundlich gemeint war oder so gedeutet werden konnte. Heute hat es ihm aber geschmeckt, sagte sie."],[3072.44,3099.28,"Wenn Gregor unter dem Essen tüchtig aufgeräumt hatte, während sie im gegenteiligen Fall der sich allmählich immer häufiger wiederholte, fast traurig zu sagen pflegte Nun ist wieder alles stehen geblieben. Während aber Gregor unmittelbar keine Neuigkeit erfahren konnte, horchte er manches aus den Nebenzimmern, und wo er nur einmal Stimmen hörte, lief er gleich zu der betreffenden Tür und drückte sich mit ganzem Leib an sie."],[3099.36,3127.48,"Besonders in der ersten Zeit gab es kein Gespräch, das nicht irgendwie, wenn auch nur im Geheimen, von ihm handelte. Zwei Tage lang waren bei allen Mahlzeiten Beratungen darüber zu hören, wie man sich jetzt verhalten solle. Aber auch zwischen den Mahlzeiten sprach man über das gleiche Thema, denn immer waren zumindest zwei Familienmitglieder zu Hause, da wohl niemand allein zu Hause bleiben wollte und man die Wohnung doch auf keinen Fall gänzlich verlassen konnte."],[3127.56,3155.48,"Auch hatte das Dienstmädchen gleich am ersten Tag es war nicht ganz klar, was und wie viel sie von dem Vorgefallenen wußte, kniefällig um die Mutter gebeten, sie sofort zu entlassen, und als sie sich eine Viertelstunde danach verabschiedete, dankte sie für die Entlassung unter Tränen wie für die größte Wohltat, die man ihr hier erwiesen hatte, und gab, ohne dass man es von ihr verlangte, einen fürchterlichen Schwur ab, niemandem auch nur das Geringste zu verraten."],[3155.72,3184.52,"Nun mußte die Schwester im Verein mit der Mutter auch kochen. Allerdings machte das nicht viel Mühe, denn man aß fast nichts. Immer wieder hörte Gregor, wie der eine den anderen vergebens zum Essen aufforderte und keine andere Antwort bekam als Danke. Ich habe genug oder etwas Ähnliches. Getrunken wurde vielleicht auch nichts. Öfters fragte die Schwester den Vater, ob er Bier haben wolle, und herzlich erbot sie sich, es selbst zu holen."],[3184.6,3219.64,"Und als der Vater schwieg, sagte sie, um ihm jedes Bedenken zu nehmen, sie könne auch die Hausmeisterin darum schicken. Aber dann sagte der Vater schließlich ein großes Nein, und es wurde nicht mehr davon gesprochen. Schon im Laufe des ersten Tages legte der Vater die ganzen Vermögensverhältnisse und Aussichten sowohl der Mutter als auch der Schwester dar. Hie und da stand er vom Tische auf und holte aus seiner kleinen Wertheim Kassa, die er aus dem vor fünf Jahren erfolgten Zusammenbruch seines Geschäftes gerettet hatte, irgendeinen Beleg oder irgendein Vormerkbuch."],[3219.72,3247.0,"Man hörte, wie er das komplizierte Schloss aufsperrte und nach Entnahme des Gesuchten wieder verschloß. Diese Erklärungen des Vaters waren zum Teil das erste Erfreuliche, was Gregor seit seiner Gefangenschaft zu hören bekam. Er war der Meinung gewesen, dass dem Vater von jenem Geschäft her nicht das geringste übrig geblieben war. Zumindest hatte ihm der Vater nichts Gegenteiliges gesagt. Und Gregor allerdings hatte ihn auch nicht darum gefragt."],[3247.08,3278.32,"Gregors Sorge war damals nur gewesen, alles daran zu setzen, um die Familie, das geschäftliche Unglück, das alle in eine vollständige Hoffnungslosigkeit gebracht hatte, möglichst rasch vergessen zu lassen. Und so hatte er damals mit ganz besonderem Feuer zu arbeiten angefangen und war fast über Nacht aus einem kleinen Kommis ein Reisender geworden, der natürlich ganz andere Möglichkeiten des Geldverdienens hatte und dessen Arbeitserfolge sich sofort in Form der Provision zu Bargeld verwandelten."],[3278.4,3303.08,"Das der erstaunten und beglückten Familie zu Hause auf den Tisch gelegt werden konnte. Das waren schöne Zeiten gewesen, und niemals nachher hatten sie sich wenigstens in diesem Glanze wiederholt. Trotzdem Gregor später so viel Geld verdiente, dass er den Aufwand der ganzen Familie zu tragen imstande war und auch trug. Man hatte sich eben daran gewöhnt, sowohl die Familie als auch Gregor."],[3303.16,3332.08,"Man nahm das Geld dankbar an, er lieferte es gern ab, aber eine besondere Wärme wollte sich nicht mehr ergeben. Nur die Schwester war Gregor doch noch nahe geblieben. Und das war sein geheimer Plan. Sie, die zum Unterschied von Gregor Musik sehr liebte und rührend Violine zu spielen verstand, nächstes Jahr, ohne Rücksicht auf die großen Kosten, die das verursachen mußte und die man schon auf andere Weise hereinbringen würde, auf das Konservatorium zu schicken."],[3332.16,3364.72,"Öfters während der kurzen Aufenthalte Gregors in der Stadt wurde in den Gesprächen mit der Schwester das Konservatorium erwähnt, aber immer nur als schöner Traum, an dessen Verwirklichung nicht zu denken war. Und die Eltern hörten nicht einmal diese unschuldigen Erwägungen gern. Aber Gregor dachte sehr bestimmt daran und beabsichtigte, es am Weihnachtsabend feierlich zu erklären. Solche in seinem gegenwärtigen Zustand ganz nutzlose Gedanken gingen ihm durch den Kopf, während er dort aufrecht an der Türe klebte, und horchte."],[3364.8,3391.8,"Manchmal konnte er vor allgemeiner Müdigkeit gar nicht mehr zuhören und ließ den Kopf nachlässig gegen die Tür schlagen, hielt ihn aber sofort wieder fest, denn selbst das kleine Geräusch, das er damit verursacht hatte, war nebenan gehört worden und hatte alle verstummen lassen. Was er nur wieder treibt? Sagte der Vater nach einer Weile, offenbar zur Türe hin gewendet, und dann erst wurde das unterbrochene Gespräch allmählich wieder aufgenommen."],[3392.04,3418.48,"Gregor erfuhr nun zur Genüge, denn der Vater pflegte sich in seinen Erklärungen öfters zu wiederholen, teils weil er selbst sich mit diesen Dingen schon lange nicht beschäftigt hatte, teils auch, weil die Mutter nicht alles gleich beim ersten Mal verstand, das trotz allen Unglücks ein allerdings ganz kleines Vermögen aus der alten Zeit noch vorhanden war, dass die nicht angerührten Zinsen in der Zwischenzeit ein wenig hatten anwachsen lassen."],[3418.56,3446.56,"Außerdem aber war das Geld, das Gregor allmonatlich nach Hause gebracht hatte, er selbst hatte nur ein paar Gulden für sich behalten, nicht vollständig aufgebraucht worden und hatte sich zu einem kleinen Kapital angesammelt. Gregor hinter seiner Türe nickte eifrig, erfreut über diese unerwartete Vorsicht und Sparsamkeit. Eigentlich hätte er ja mit diesen überschüssigen Geldern die Schuld des Vaters gegenüber dem Chef weiter abgetragen haben können."],[3446.64,3469.0,"Und jener Tag, an dem er diesen Posten hätte loswerden können, wäre weit näher gewesen. Aber jetzt war es zweifellos besser so, wie es der Vater eingerichtet hatte. Nun genügte dieses Geld aber ganz und gar nicht, um die Familie etwa von den Zinsen leben zu lassen. Das genügte vielleicht, um die Familie ein, höchstens zwei Jahre zu erhalten. Mehr war es nicht."],[3469.08,3501.08,"Es war also bloß eine Summe, die man eigentlich nicht angreifen durfte und die für den Notfall zurückgelegt werden mußte. Das Geld zum Leben aber mußte man verdienen. Nun war aber der Vater ein zwar gesunder, aber alter Mann, der schon fünf Jahre nichts gearbeitet hatte und sich jedenfalls nicht viel zutrauen durfte. Er hatte in diesen fünf Jahren, welche die ersten Ferien seines mühevollen und doch erfolglosen Lebens waren, viel fett angesetzt und war dadurch recht schwerfällig geworden."],[3501.16,3536.2,"Und die alte Mutter sollte nun vielleicht Geld verdienen. Die an Asthma litt, der eine Wanderung durch die Wohnung schon Anstrengung verursachte und die jeden zweiten Tag in Atembeschwerden auf dem Sofa beim offenen Fenster verbrachte. Und die Schwester sollte Geld verdienen, die noch ein Kind war mit ihren 17 Jahren, und der ihre bisherige Lebensweise so sehr zu gönnen war, die daraus bestanden hatte, sich nett zu kleiden, lange zu schlafen, in der Wirtschaft mitzuhelfen, an ein paar bescheidenen Vergnügungen sich zu beteiligen und vor allem Violine zu spielen."],[3536.28,3575.92,"Wenn die Rede auf diese Notwendigkeit des Geldverdienens kam, ließ zuerst immer Gregor die Türe los und warf sich auf das neben der Tür befindliche kühle Ledersofa. Denn ihm war ganz heiß vor Beschämung und Trauer. Oft lag er dort, die ganzen langen Nächte über, schlief keinen Augenblick und scharrte nur stundenlang auf dem Leder. Oder er scheute nicht die große Mühe, einen Sessel zum Fenster zu schieben, dann die Fensterbrüstung kriechen und in den Sessel gestemmt, sich ans Fenster zu lehnen, offenbar nur in irgendeiner Erinnerung an das Befreiende, das früher für ihn darin gelegen war, aus dem Fenster zu schauen."],[3576.0,3606.48,"Denn tatsächlich sah er von Tag zu Tag die auch nur ein wenig entfernten Dinge immer undeutlicher. Das gegenüberliegende Krankenhaus, dessen nur allzu häufigen Anblick er früher verflucht hatte, bekam er überhaupt nicht mehr zu Gesicht. Und wenn er nicht genau gewusst hätte, dass er in der stillen, aber völlig städtischen Charlottenstraße wohnte, hätte er glauben können, von seinem Fenster aus in eine Einöde zu schauen, in welcher der graue Himmel und die graue Erde ununterscheidbar sich vereinigten."],[3606.56,3628.12,"Nur zweimal hatte die aufmerksame Schwester sehen müssen, dass der Sessel beim Fenster stand, als sie schon jedes Mal, nachdem sie das Zimmer aufgeräumt hatte, den Sessel wieder genau zum Fenster hin schob, ja sogar von nun ab den inneren Fensterflügel offen ließ. Hätte Gregor nur mit der Schwester sprechen und ihr für alles danken können, was sie für ihn machen mußte."],[3628.2,3654.28,"Er hätte ihre Dienste leichter ertragen. So aber litt er darunter. Die Schwester suchte freilich die Peinlichkeit des Ganzen möglichst zu verwischen. Und je längere Zeit verging, desto besser gelang es ihr natürlich auch. Aber auch Gregor durchschaute mit der Zeit alles viel genauer. Schon ihr Eintritt war für ihn schrecklich. Kaum war sie eingetreten, lief sie, ohne sich Zeit zu nehmen, die Türe zu schließen."],[3654.36,3691.08,"So sehr sie sonst darauf achtete, jedem den Anblick von Gregors Zimmer zu ersparen, geradewegs zum Fenster und riss es, als ersticke sie fast mit hastigen Händen auf, blieb auch, selbst wenn es noch so kalt war, ein Weilchen beim Fenster und atmete tief. Mit diesem Laufen und Lärmen erschreckte sie Gregor täglich zweimal. Die ganze Zeit über zitterte er unter dem Kanapee und wusste doch sehr gut, dass sie ihn gewiss gerne damit verschont hätte, wenn es ihr nur möglich gewesen wäre, sich in einem Zimmer, in dem sich Gregor befand, bei geschlossenem Fenster aufzuhalten."],[3691.08,3720.16,"Einmal, es war wohl schon ein Monat seit Gregors Verwandlung vergangen, und es war doch schon für die Schwester kein besonderer Grund mehr, über Gregors Aussehen in Erstaunen zu geraten, kam sie ein wenig früher als sonst und traf Gregor noch an, wie er unbeweglich und so recht zum Erschrecken aufgestellt, aus dem Fenster schaute. Es wäre für Gregor nicht unerwartet gewesen, wenn sie nicht eingetreten wäre, da er sie durch seine Stellung verhinderte, sofort das Fenster zu öffnen."],[3720.24,3759.6,"Aber sie trat nicht nur nicht ein, sie fuhr sogar zurück und schloss die Tür. Ein Fremder hätte geradezu denken können, Gregor habe ihr aufgelauert und habe sie beißen wollen. Gregor versteckte sich natürlich sofort unter dem Kanapee, aber er mußte bis zum 12:00 warten, ehe die Schwester wiederkam. Und sie schien viel unruhiger als sonst. Er erkannte daraus, dass ihr sein Anblick noch immer unerträglich war und ihr auch weiterhin unerträglich bleiben müsse, und dass sie sich wohl sehr überwinden mußte vor dem Anblick auch nur der kleinen Partie seines Körpers, nicht davonzulaufen, mit der er unter dem Kanapee hervorragte."],[3759.68,3784.08,"Um ihr auch diesen Anblick zu ersparen, trug er eines Tages auf seinem Rücken. Er brauchte zu dieser Arbeit vier Stunden das Leintuch auf das Kanapee und ordnete es in einer solchen Weise an, dass er nun gänzlich verdeckt war, und dass die Schwester, selbst wenn sie sich bückte, ihn nicht sehen konnte. Wäre dieses Leintuch ihrer Meinung nach nicht nötig gewesen, dann hätte sie es ja entfernen können."],[3784.28,3810.76,"Denn dass es nicht zum Vergnügen Gregors gehören konnte, sich so ganz und gar abzusperren, war doch klar genug. Aber sie ließ das Leintuch so, wie es war, und Gregor glaubte sogar, einen dankbaren Blick erhascht zu haben, als er einmal mit dem Kopf vorsichtig das Leintuch ein wenig lüftete, um nachzusehen, wie die Schwester die neue Einrichtung aufnahm. In den ersten 14 Tagen konnten es die Eltern nicht über sich bringen."],[3810.76,3844.88,"Zu ihm hereinzukommen, und er hörte oft, wie sie die jetzige Arbeit der Schwester völlig erkannten, während sie sich bisher häufig über die Schwester geärgert hatten, weil sie ihnen als ein etwas nutzloses Mädchen erschienen war. Nun aber warteten oft beide, der Vater und die Mutter, vor Gregors Zimmer, während die Schwester dort aufräumte. Und kaum war sie herausgekommen, mußte sie ganz genau erzählen, wie es in dem Zimmer aussah, was Gregor gegessen hatte, wie er sich diesmal benommen hatte und ob vielleicht eine kleine Besserung zu bemerken war."],[3844.96,3870.4,"Die Mutter übrigens wollte verhältnismäßig bald Gregor besuchen, aber der Vater und die Schwester hielten sie zuerst mit Vernunftgründen zurück, denen Gregor sehr aufmerksam zuhörte und die er vollständig billigte. Später aber mußte man sie mit Gewalt zurückhalten, und wenn sie dann rief Laßt mich doch zu Gregor! Er ist ja mein unglücklicher Sohn! Begreift ihr es denn nicht, dass ich zu ihm muß?"],[3870.48,3896.2,"Dann dachte Gregor, dass es vielleicht doch gut wäre, wenn die Mutter hereinkäme. Nicht jeden Tag natürlich, aber vielleicht einmal in der Woche. Sie verstand doch alles viel besser als die Schwester, die trotz all ihrem Mute doch nur ein Kind war. Und im letzten Grunde vielleicht nur aus kindlichem Leichtsinn eine so schwere Aufgabe übernommen hatte. Der Wunsch Gregors, die Mutter zu sehen, ging bald in Erfüllung."],[3896.28,3920.68,"Während des Tages wollte Gregor schon aus Rücksicht auf seine Eltern sich nicht beim Fenster zeigen. Kriechen konnte er aber auf den paar Quadratmetern des Fußbodens auch nicht viel. Das ruhige Liegen ertrug er schon während der Nacht schwer. Das Essen machte ihm bald nicht mehr das geringste Vergnügen, und so nahm er zur Zerstreuung die Gewohnheit, an kreuz und quer über Wände und Plafond zu kriechen."],[3920.76,3950.08,"Besonders oben auf der Decke hing er gern. Es war ganz anders als das Liegen auf dem Fußboden. Man atmete freier. Ein leichtes Schwingen ging durch den Körper, und in der fast glücklichen Zerstreutheit, in der sich Gregor dort oben befand, konnte es geschehen, dass er zu seiner eigenen Überraschung sich losließ und auf den Boden klatschte. Aber nun hatte er natürlich seinen Körper ganz anders in der Gewalt als früher und beschädigte sich selbst bei einem so großen Falle nicht."],[3950.16,3978.28,"Die Schwester nun bemerkte sofort die neue Unterhaltung, die Gregor für sich gefunden hatte. Er hinterließ ja auch beim Kriechen hie und da Spuren seines Klebstoffes. Und da setzte sie es sich in den Kopf. Gregor das Kriechen in größtem Ausmaße zu ermöglichen und die Möbel, die es verhinderten, also vor allem den Kasten und den Schreibtisch wegzuschaffen. Nun war sie aber nicht imstande, dies allein zu tun, denn Vater wagte sie nicht, um Hilfe zu bitten."],[3978.36,4010.76,"Das Dienstmädchen hätte ihr ganz gewiss nicht geholfen, denn dieses etwa 16-jährige Mädchen harrte zwar tapfer seit Entlassung der früheren Köchin aus, hatte aber um die Vergünstigung gebeten, die Küche unaufhörlich versperrt halten zu dürfen und nur auf besonderen Anruf öffnen zu müssen. So blieb der Schwester also nichts übrig, als einmal in Abwesenheit des Vaters die Mutter zu holen. Mit Ausrufen erregter Freude kam die Mutter auch heran, verstummte aber an der Tür vor Gregors Zimmer."],[4010.84,4041.28,"Zuerst sah natürlich die Schwester nach, ob alles im Zimmer in Ordnung war. Dann erst ließ sie die Mutter eintreten. Gregor hatte in größter Eile das Leintuch noch tiefer und mehr in Falten gezogen. Das Ganze sah wirklich nur wie ein zufällig über das pe geworfenes Leintuch aus. Gregor unterließ auch diesmal, unter dem Leintuch zu spionieren. Er verzichtete darauf, die Mutter schon diesmal zu sehen, und war nur froh, dass sie nun doch gekommen war."],[4041.36,4065.68,"Komm nur, man sieht ihn nicht, sagte die Schwester, und offenbar führte sie die Mutter an der Hand. Gregor hörte nun, wie die zwei schwachen Frauen den immerhin schweren alten Kasten von seinem Platze rückten und wie die Schwester immerfort den größten Teil der Arbeit für sich beanspruchte, ohne auf die Warnungen der Mutter zu hören, welche fürchtete, dass sie sich überanstrengen werde."],[4065.76,4090.12,"Es dauerte sehr lange. Wohl nach schon viertelstündiger Arbeit sagte die Mutter, man solle den Kasten doch lieber hier lassen, denn erstens sei er zu schwer, sie würden vor Ankunft des Vaters nicht fertig werden, und mit dem Kasten in der Mitte des Zimmers Gregor jeden Weg verrammeln. Zweitens aber sei es doch gar nicht sicher, dass Gregor mit der Entfernung der Möbel ein Gefallen geschehe."],[4090.2,4119.36,"Ihr scheine das Gegenteil der Fall zu sein. Ihr bedrückte der Anblick der leeren Wand geradezu das Herz. Und warum solle nicht auch Gregor diese Empfindung haben, da er doch an die Zimmermöbel längst gewöhnt sei und sich deshalb im leeren Zimmer verlassen fühlen werde? Und ist es dann nicht so schloss die Mutter ganz leise, wie sie überhaupt fast flüsterte, als wolle sie vermeiden, dass Gregor, dessen genauen Aufenthalt sie ja nicht kannte, auch nur den Klang der Stimme höre."],[4119.44,4147.64,"Denn dass er die Worte nicht verstand, davon war sie überzeugt. Und ist es nicht so, als ob wir durch die Entfernung der Möbel zeigten, dass wir jede Hoffnung auf Besserung aufgeben und in rücksichtslos sich selbst überlassen? Ich glaube, es wäre das Beste, wir suchen das Zimmer genau in dem Zustand zu erhalten, in dem es früher war. Damit Gregor, wenn er wieder zu uns zurückkommt, alles unverändert findet und um so leichter die Zwischenzeit vergessen kann."],[4147.84,4188.68,"Beim Anhören dieser Worte der Mutter erkannte Gregor, dass der Mangel jeder unmittelbaren menschlichen Ansprache, verbunden mit dem einförmigen Leben inmitten der Familie, im Laufe dieser zwei Monate seinen Verstand hatte verwirren müssen. Denn anders konnte er es sich nicht erklären, dass er ernsthaft danach hatte verlangen könne, dass sein Zimmer ausgeleert würde. Hatte er wirklich Lust, das warme, mit ererbten Möbeln gemütlich ausgestattete Zimmer in eine Höhle verwandeln zu lassen, in der er dann freilich nach allen Richtungen ungestört würde kriechen können, jedoch auch unter gleichzeitigem schnellen gänzlichen Vergessen seiner menschlichen Vergangenheit."],[4188.76,4212.24,"War er doch jetzt schon nahe daran, zu vergessen, und nur die seit langem nicht gehörte Stimme der Mutter hatte ihn aufgerüttelt. Nichts sollte entfernt werden, alles mußte bleiben. Die guten Einwirkungen der Möbel auf seinen Zustand konnte er nicht entbehren, und wenn die Möbel ihn hinderten, das sinnlose Herumkriechen zu betreiben, so war es kein Schaden, sondern ein großer Vorteil."],[4212.44,4242.36,"Aber die Schwester war leider anderer Meinung. Sie hatte sich allerdings nicht ganz unberechtigt angewöhnt, bei Besprechung der Angelegenheiten Gregors als besonders Sachverständige gegenüber den Eltern aufzutreten und so war auch jetzt der Rat der Mutter für die Schwester Grund genug, auf der Entfernung nicht nur des Kastens und des Schreibtisches, an die sie zuerst allein gedacht hatte, sondern auf der Entfernung sämtlicher Möbel mit Ausnahme des unentbehrlichen Canapes zu bestehen."],[4242.44,4280.36,"Das war natürlich nicht nur kindlicher Trotz, und das in der letzten Zeit so unerwartet und schwer erworbene Selbstvertrauen, das sie zu dieser Forderung bestimmte. Sie hatte doch auch tatsächlich beobachtet, dass Gregor viel Raum zum Kriechen brauchte, dagegen die Möbel, soweit man sehen konnte, nicht im geringsten benützte. Vielleicht, aber spielte auch der schwärmerische Sinn der Mädchen ihres Alters mit, der bei jeder Gelegenheit seine Befriedigung sucht und durch den Grete jetzt sich dazu verlocken ließ, die Lage Gregors noch schreckenerregender machen zu wollen, um dann noch mehr als bis jetzt für ihn leisten zu können."],[4280.44,4325.44,"Denn in einen Raum, in dem Gregor ganz allein die leeren Wände beherrschte, würde wohl kein Mensch außer Grete jemals einzutreten sich getrauen. Und so ließ sie sich von ihrem Entschlusse durch die Mutter nicht abbringen, die auch in diesem Zimmer vor lauter Unruhe unsicher schien. Bald verstummte und der Schwester nach Kräften beim Hinausschaffen des Kastens half. Nun, den Kasten konnte Gregor im Notfall noch entbehren, aber schon der Schreibtisch mußte bleiben, und kaum hatten die Frauen mit dem Kasten, an den sie sich ächzend drückten, das Zimmer verlassen, als Gregor den Kopf unter dem Kanapee hervorstieß, um zu sehen, wie er vorsichtig und möglichst rücksichtsvoll eingreifen könnte."],[4325.52,4354.36,"Aber zum Unglück war es gerade die Mutter, welche zuerst zurückkehrte, während Grete im Nebenzimmer den Kasten umfangen hielt und ihn allein hin und her schwang, ohne ihn natürlich von der Stelle zu bringen. Die Mutter aber war Gregors Anblick nicht gewöhnt. Er hätte sie krank machen können, und so eilte Gregor erschrocken im Rückwärtslauf bis an das andere Ende des Canapes, konnte es aber nicht mehr verhindern, dass das Leintuch vorne ein wenig sich bewegte."],[4354.44,4383.32,"Das genügte, um die Mutter aufmerksam zu machen. Sie stockte, stand einen Augenblick still und ging dann zu Grete zurück. Trotzdem sich Gregor immer wieder sagte, dass ja nichts Außergewöhnliches geschehe, sondern nur ein paar Möbel umgestellt würden, wirkte doch, wie er sich bald eingestehen musste, dieses Hin und Hergehen der Frauen, ihre kleinen Zurufe, das Kratzen der Möbel auf dem Boden wie ein großer, von allen Seiten genährter Trubel auf ihn."],[4383.4,4415.44,"Und er mußte sich, so fest er Kopf und Beine an sich zog und den Leib bis an den Boden drückte, unweigerlich sagen, dass er das ganze nicht lange aushalten werde. Sie räumten ihm sein Zimmer aus, nahmen ihm alles, was ihm lieb war. Den Kasten, in dem die Laubsäge und andere Werkzeuge lagen, hatten sie schon hinausgetragen, lockerten jetzt den schon im Boden fest eingegrabenen Schreibtisch, an dem er als Handelsakademiker, als Bürger, Schüler, ja sogar schon als Volksschüler seine Aufgaben geschrieben hatte."],[4415.52,4439.8,"Da hatte er wirklich keine Zeit mehr, die guten Absichten zu prüfen, welche die zwei Frauen hatten, deren Existenz er übrigens fast vergessen hatte. Denn vor Erschöpfung arbeiteten sie schon stumm und man hörte nur das schwere Tappen ihrer Füße. Und so brach er denn hervor. Die Frauen stützten sich gerade im Nebenzimmer an den Schreibtisch, um ein wenig zu verschnaufen, wechselte viermal die Richtung des Laufes."],[4439.88,4469.52,"Er wusste wirklich nicht, was er zuerst retten sollte. Da sah er an der im übrigen schon leeren Wand auffallend das Bild der in lauter Pelzwerk gekleideten Dame hängen kroch eilends hinauf und preßte sich an das Glas, das ihn festhielt und seinem heißen Bauch wohltat. Dieses Bild wenigstens, das Gregor jetzt ganz verdeckte, würde nun gewiss niemand wegnehmen. Er verdrehte den Kopf nach der Tür des Wohnzimmers, um die Frauen bei ihrer Rückkehr zu beobachten."],[4469.6,4501.12,"Sie hatten sich nicht viel Ruhe gegönnt und kamen schon wieder. Grete hatte den Arm um die Mutter gelegt und trug sie fast. Also was nehmen wir jetzt? Sagte Grete und sah sich um. Da kreuzten sich ihre Blicke mit denen Gregors an der Wand. Wohl nur infolge der Gegenwart der Mutter behielt sie ihre Fassung, beugte ihr Gesicht zur Mutter, um diese vom Herumschauen abzuhalten, und sagte allerdings zitternd und unüberlegt Komm, wollen wir nicht lieber auf einen Augenblick noch ins Wohnzimmer zurückgehen?"],[4501.2,4533.16,"Die Absicht Gerätes war für Gregor klar. Sie wollte die Mutter in Sicherheit bringen und dann ihn von der Wand hinunterjagen. Nun, sie konnte es ja immerhin versuchen. Er saß auf seinem Bild und gab es nicht her. Lieber würde er Grete ins Gesicht springen. Aber Gerätes Worte hatten die Mutter erst recht beunruhigt. Sie trat zur Seite, erblickte den riesigen braunen Fleck auf der geblümten Tapete, rief, ehe ihr eigentlich zum Bewusstsein kam, dass das Gregor war, was sie sah, mit schreiender, rauher Stimme."],[4533.24,4561.4,"Ach Gott, ach Gott! Und fiel mit ausgebreiteten Armen, als gebe sie alles auf. Über das Kanapee hin und rührte sich nicht. Du, Gregor! Rief die Schwester mit erhobener Faust und eindringlichen Blicken. Es waren seit der Verwandlung die ersten Worte, die sie unmittelbar an ihn gerichtet hatte. Sie lief ins Nebenzimmer, um irgendeine Essenz zu holen, mit der sie die Mutter aus ihrer Ohnmacht wecken könnte."],[4561.48,4585.08,"Gregor wollte auch helfen. Zur Rett
